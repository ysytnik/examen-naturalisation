-t-elle été fondée?","o":["1945","1992","2002","1975"],"a":1,"r":"L'Union européenne (UE) a été officiellement créée par le traité de Maastricht en 1992. Elle succède à la Communauté économique européenne (CEE), qui avait été fondée en 1957 par le traité de Rome."},{"t":"Histoire, géographie et culture","q":"Quand a eu lieu la Seconde guerre mondiale ?","o":["1914-1918","1939-1945","1940-1944","1945-1948"],"a":1,"r":"La Seconde guerre mondiale a eu lieu de 1939 à 1945."},{"t":"Histoire, géographie et culture","q":"Quand a eu lieu la Première guerre mondiale ?","o":["1914-1918","1939-1945","1912-1913","1918-1922"],"a":0,"r":"La Première guerre mondiale a eu lieu de 1914 à 1918."},{"t":"Histoire, géographie et culture","q":"Sous quel président a été abolie la peine de mort en France ?","o":["Valéry Giscard d'Estaing","Georges Pompidou","François Mitterrand","Jacques Chirac"],"a":2,"r":"La peine de mort a été abolie par la loi du 9 octobre 1981, sous la présidence de François Mitterrand. Le garde des Sceaux, Robert Badinter, a mené ce combat historique devant le Parlement."},{"t":"Histoire, géographie et culture","q":"Que célèbre-t-on le 8 mai ?","o":["L'armistice de la Première Guerre mondiale (1918).","La victoire des Alliés sur l'Allemagne nazie (1945).","La Fête nationale (Prise de la Bastille).","Le débarquement de Normandie (D-Day)."],"a":1,"r":"Le 8 mai 1945 marque la capitulation de l'Allemagne nazie et la fin des combats de la Seconde Guerre mondiale en Europe."},{"t":"Histoire, géographie et culture","q":"Quelle est la première étape de la construction européenne en 1951 ?","o":["La création de la Banque Centrale Européenne","La signature du traité de Rome","La création de la Communauté européenne du charbon et de l'acier (CECA)","L'adoption de l'euro"],"a":2,"r":"La CECA a été créée par le traité de Paris en 1951. C'est l'acte fondateur qui a permis de lier économiquement les pays européens pour garantir une paix durable."},{"t":"Histoire, géographie et culture","q":"Qui était une figure de la Résistance française pendant la Seconde Guerre mondiale ?","o":["Philippe Pétain","Pierre Laval","Jean Moulin","Georges Clemenceau"],"a":2,"r":"Jean Moulin a été un chef emblématique de la Résistance intérieure française."},{"t":"Histoire, géographie et culture","q":"Le 11 novembre est un jour férié. À quoi correspond cette date ?","o":["La fin de la Seconde Guerre mondiale.","L'armistice de la Première Guerre mondiale.","Le début de la Première Guerre mondiale.","La Fête Nationale française."],"a":1,"r":"C'est l'Armistice de 1918 (fin des combats de la Grande Guerre). Attention aux confusions fréquentes : la Seconde Guerre mondiale finit le 8 mai (1945), et la Fête Nationale est le 14 juillet."},{"t":"Histoire, géographie et culture","q":"Depuis quand l'esclavage a-t-il été aboli en France ?","o":["1789","1905","1802","1848"],"a":3,"r":"Il s'agit de l'abolition définitive, signée le 27 avril 1848 sous la IIe République (grâce à Victor Schœlcher). Une première abolition avait eu lieu en 1794, mais Napoléon avait rétabli l'esclavage en 1802."},{"t":"Histoire, géographie et culture","q":"Qui a aboli l'esclavage en France ?","o":["Victor Schœlcher","Toussaint Louverture","Napoléon Bonaparte","Jules Ferry"],"a":0,"r":"C'est Victor Schœlcher qui a rédigé le décret d'abolition définitive de l'esclavage en 1848. Toussaint Louverture a lutté pour la liberté à Saint-Domingue (Haïti). Napoléon l'avait rétabli en 1802 et Jules Ferry est le père de l'école publique."},{"t":"Histoire, géographie et culture","q":"Depuis quelle année l'école publique est-elle gratuite ?","o":["1881","1885","1905","1959"],"a":0,"r":"La loi de 1881 (l'une des 'lois Jules Ferry') a instauré la gratuité de l'école primaire. La loi de 1882 a ensuite ajouté l'obligation d'instruction et la laïcité."},{"t":"Histoire, géographie et culture","q":"En 1944, qu'est-ce qui a changé pour les femmes ?","o":["Elles ont obtenu le droit de vote.","Elles ont obtenu l'égalité salariale.","Elles ont obtenu le droit de divorcer.","Elles ont obtenu le droit de travailler sans autorisation."],"a":0,"r":"En 1944, les femmes françaises ont obtenu le droit de vote et d'éligibilité."},{"t":"Histoire, géographie et culture","q":"Quelle organisation a été créée en 1945 après la Seconde Guerre mondiale ?","o":["La Société des Nations (SDN)","L'Organisation des Nations Unies (ONU)","L'Organisation Mondiale du Commerce (OMC)","L'Organisation du Traité de l'Atlantique Nord (OTAN)"],"a":1,"r":"L'ONU a été fondée le 24 octobre 1945 pour maintenir la paix. Elle remplace la SDN (créée en 1919 après la Grande Guerre). L'OTAN date de 1949 et l'OMC de 1995."},{"t":"Histoire, géographie et culture","q":"En quelle année l'euro est-il devenu la monnaie officielle de la France ?","o":["1992","2000","2002","2007"],"a":2,"r":"L'euro est devenu la monnaie fiduciaire (mise en circulation des pièces et billets) le 1er janvier 2002. Bien que l'union monétaire ait débuté dès 1999 sur les marchés, c'est en 2002 qu'il a remplacé le franc dans la vie quotidienne."},{"t":"Histoire, géographie et culture","q":"Lors de la seconde guerre mondiale, à quelle date la ville de Paris a-t-elle été libérée ?","o":["Le 25 août 1944","Le 6 juin 1944","Le 8 mai 1945","Le 18 juin 1940"],"a":0,"r":"C'est le 25 août 1944 (reddition du Général von Choltitz). Le lendemain (26 août) a eu lieu le défilé de la victoire sur les Champs-Élysées. Ne pas confondre avec le Débarquement en Normandie (6 juin)."},{"t":"Histoire, géographie et culture","q":"Quel était le principal port français impliqué dans la traite négrière au XVIIIe siècle ?","o":["Marseille","Bordeaux","Nantes","Le Havre"],"a":2,"r":"Nantes était le premier port négrier français au XVIIIe siècle, suivi de près par Bordeaux."},{"t":"Histoire, géographie et culture","q":"Quel célèbre philosophe des Lumières a dénoncé l'esclavage ?","o":["Molière","Victor Hugo","Montesquieu","Émile Zola"],"a":2,"r":"C'est Montesquieu (18ème siècle, siècle des Lumières). Molière est du 17ème siècle (Louis XIV), tandis que Victor Hugo et Émile Zola sont des écrivains du 19ème siècle."},{"t":"Histoire, géographie et culture","q":"Quelle oeuvre a été écrite par Victor Hugo ?","o":["Madame Bovary.","Les Misérables.","Le Père Goriot.","Le Petit Prince."],"a":1,"r":"Publié en 1862, 'Les Misérables' est un chef-d'œuvre de Victor Hugo. 'Madame Bovary' a été écrit par Flaubert, 'Le Père Goriot' par Balzac, et 'Le Petit Prince' par Saint-Exupéry."},{"t":"Histoire, géographie et culture","q":"Quel peintre est français ?","o":["Vincent van Gogh","Léonard de Vinci","Claude Monet","Edvard Munch"],"a":2,"r":"Claude Monet est un peintre français, chef de file de l'impressionnisme. Vincent van Gogh était néerlandais, Léonard de Vinci italien (bien qu'il ait fini sa vie en France) et Edvard Munch norvégien."},{"t":"Histoire, géographie et culture","q":"Quel plat est une spécialité de la cuisine française ?","o":["La paëlla","Le risotto","Le coq au vin","Le tajine"],"a":2,"r":"Le coq au vin est un plat emblématique de la gastronomie française, contrairement aux autres options qui sont d'origines espagnole, italienne ou maghrébine."},{"t":"Histoire, géographie et culture","q":"Qui était Marie Curie ?","o":["Une célèbre actrice française du cinéma muet.","Une pionnière dans le domaine de la radioactivité et double prix Nobel.","Une écrivaine française du XIXe siècle.","Une chanteuse d'opéra renommée."],"a":1,"r":"Marie Curie est une physicienne et chimiste d'origine polonaise, naturalisée française. Elle est la seule femme à avoir reçu deux prix Nobel (Physique en 1903 et Chimie en 1911) pour ses recherches pionnières sur la radioactivité."},{"t":"Histoire, géographie et culture","q":"Qui a peint 'La liberté guidant le peuple' ?","o":["Claude Monet","Edgar Degas","Eugène Delacroix","Pierre-Auguste Renoir"],"a":2,"r":"Cette œuvre romantique d'Eugène Delacroix célèbre la Révolution de 1830 (les 'Trois Glorieuses') et constitue un symbole républicain majeur."},{"t":"Histoire, géographie et culture","q":"Dans quel grand musée parisien est exposée la Joconde ?","o":["Le Musée d'Orsay","Le Centre Pompidou","Le Louvre","Le Musée Rodin"],"a":2,"r":"La Joconde, peinte par Léonard de Vinci, est exposée au musée du Louvre à Paris."},{"t":"Histoire, géographie et culture","q":"Quel château célèbre se trouve près de Paris et symbolise le pouvoir royal de Louis XIV ?","o":["Le Château de Chambord","Le Château de Chenonceau","Le Château de Versailles","Le Château d'Angers"],"a":2,"r":"Le Château de Versailles est le symbole du pouvoir de Louis XIV et de la monarchie française."},{"t":"Histoire, géographie et culture","q":"Où peut-on voir des peintures préhistoriques en France ?","o":["Au Château de Versailles","Dans la grotte de Lascaux","Au Mont-Saint-Michel","Aux alignements de Carnac"],"a":1,"r":"Située en Dordogne, la grotte de Lascaux (dont on visite aujourd'hui la réplique pour protéger le site original) abrite de célèbres peintures rupestres du Paléolithique."},{"t":"Histoire, géographie et culture","q":"Quel peintre célèbre a peint les Nymphéas ?","o":["Paul Cézanne","Auguste Renoir","Claude Monet","Edgar Degas"],"a":2,"r":"Claude Monet, chef de file de l'impressionnisme, a peint la célèbre série des 'Nymphéas' depuis son jardin de Giverny. Elles sont exposées au musée de l'Orangerie à Paris."},{"t":"Histoire, géographie et culture","q":"Pendant quelles journées peut-on visiter gratuitement des lieux culturels en France ?","o":["Les jours fériés","Les week-ends","Les Journées européennes des métiers d'art","Les Journées européennes du patrimoine"],"a":3,"r":"Les Journées européennes du patrimoine permettent de visiter gratuitement des monuments et des lieux de pouvoir (comme le Palais de l'Élysée) habituellement fermés au public."},{"t":"Histoire, géographie et culture","q":"Que symbolise le 1er mai ?","o":["La fête nationale française","La Fête du Travail","La Fête de la Musique","La fête de l'Assomption"],"a":1,"r":"Le 1er mai est la Fête du Travail. C'est l'unique jour férié obligatoirement chômé et payé pour tous les salariés en France (sauf exceptions liées à l'activité)."},{"t":"Histoire, géographie et culture","q":"Qui était Monsieur Rouget de Lisle ?","o":["Le premier président de la République française.","Le compositeur de La Marseillaise.","Le général qui a mené la bataille de Verdun.","L'inventeur du télégraphe."],"a":1,"r":"Claude Joseph Rouget de Lisle est le compositeur de l'hymne national français, La Marseillaise."},{"t":"Histoire, géographie et culture","q":"À quelle occasion a été construite la Tour Eiffel ?","o":["Pour l'Exposition Universelle de 1889","Pour célébrer la fin de la guerre de 1870","Pour l'Exposition Coloniale de 1931","Pour marquer le bicentenaire de la Révolution française"],"a":0,"r":"La Tour Eiffel a été construite pour l'Exposition Universelle de 1889, date choisie pour commémorer le centenaire de la Révolution française."},{"t":"Histoire, géographie et culture","q":"Quelle chaîne de montagne est située entre la France et l'Espagne ?","o":["Le massif des Alpes.","La chaîne des Vosges.","Le massif du Jura.","La chaîne des Pyrénées."],"a":3,"r":"Les Pyrénées forment une frontière naturelle au sud-ouest de la France, la séparant de l'Espagne. Les Alpes la séparent de l'Italie et de la Suisse."},{"t":"Histoire, géographie et culture","q":"Quelle chaîne de montagnes est située entre la France et l'Italie ?","o":["Les Pyrénées","Les Vosges","Le Jura","Les Alpes"],"a":3,"r":"Les Alpes forment une frontière naturelle entre la France et l'Italie."},{"t":"Histoire, géographie et culture","q":"Qui était Molière ?","o":["Un philosophe des Lumières du XVIIIe siècle.","Un écrivain et dramaturge français du XVIIe siècle.","Un célèbre peintre de la Renaissance.","Un poète du XIXe siècle, auteur des Contemplations."],"a":1,"r":"Molière, de son vrai nom Jean-Baptiste Poquelin, est l'auteur de théâtre le plus célèbre du XVIIe siècle (siècle de Louis XIV), connu pour ses comédies comme 'Le Tartuffe' ou 'L'Avare'."},{"t":"Histoire, géographie et culture","q":"Qui était Charles Baudelaire ?","o":["Un philosophe politique.","Un romancier du XIXe siècle.","Un poète français majeur du XIXe siècle.","Un compositeur de musique classique."],"a":2,"r":"Charles Baudelaire est l'auteur du recueil 'Les Fleurs du mal'. Il est considéré comme le précurseur de la poésie moderne, ayant marqué l'histoire littéraire par son exploration du 'Spleen' et de la beauté."},{"t":"Histoire, géographie et culture","q":"Qui était George Sand ?","o":["Une physicienne ayant travaillé sur la radioactivité.","Une peintre célèbre du courant impressionniste.","Une écrivaine française du XIXe siècle.","La première femme élue Présidente de la République."],"a":2,"r":"George Sand (pseudonyme d'Aurore Dupin) est une femme de lettres prolifique du XIXe siècle, connue pour ses romans et son mode de vie indépendant, défiant les conventions de son époque."},{"t":"Histoire, géographie et culture","q":"Qui était Simone de Beauvoir ?","o":["Une femme politique française, entrée au Panthéon en 2018.","Une physicienne célèbre, double lauréate du prix Nobel.","Une philosophe, romancière et théoricienne du féminisme française.","La première femme écrivaine élue à l'Académie française."],"a":2,"r":"Simone de Beauvoir (1908-1986) est une figure clé de la philosophie existentialiste et l'auteure du livre fondateur du féminisme 'Le Deuxième Sexe'. Elle ne doit pas être confondue avec la femme politique Simone Veil."},{"t":"Histoire, géographie et culture","q":"Qui était Albert Camus ?","o":["Un célèbre compositeur de musique classique.","Un historien spécialiste de la Révolution.","Un écrivain et philosophe français prix Nobel.","Un homme politique et ancien ministre."],"a":2,"r":"C'est un grand écrivain et philosophe français. Il est l'auteur du roman L'Étranger. Né en Algérie française, il a reçu le prix Nobel de littérature en 1957."},{"t":"Histoire, géographie et culture","q":"Qui était Marguerite Yourcenar ?","o":["Une cantatrice.","Une peintre.","Une écrivaine et académicienne française.","Une réalisatrice."],"a":2,"r":"Marguerite Yourcenar est une célèbre écrivaine française et la première femme à avoir été élue à l'Académie française, en 1980."},{"t":"Histoire, géographie et culture","q":"Qui était Paul Cézanne ?","o":["Un écrivain français.","Un célèbre compositeur.","Un peintre post-impressionniste français.","Un philosophe."],"a":2,"r":"Paul Cézanne est considéré comme l'un des plus grands peintres de la fin du XIXe siècle."},{"t":"Histoire, géographie et culture","q":"Qui était Auguste Rodin ?","o":["Un écrivain célèbre.","Un peintre impressionniste.","Un sculpteur français.","Un architecte de la Renaissance."],"a":2,"r":"Auguste Rodin est l'un des plus grands sculpteurs français, mondialement connu pour ses œuvres 'Le Penseur' et 'Le Baiser'."},{"t":"Histoire, géographie et culture","q":"Qui était un célèbre compositeur français ?","o":["Wolfgang Amadeus Mozart","Ludwig van Beethoven","Claude Debussy","Johann Sebastian Bach"],"a":2,"r":"Claude Debussy est un compositeur français majeur de la période impressionniste."},{"t":"Histoire, géographie et culture","q":"Qui était Auguste Renoir ?","o":["Un romancier du réalisme.","Un compositeur de musique classique.","Un peintre impressionniste français.","Un homme politique de la IIIe République."],"a":2,"r":"Auguste Renoir est un peintre majeur du mouvement impressionniste, célèbre pour ses scènes de la vie parisienne."},{"t":"Histoire, géographie et culture","q":"Quel musée est situé à Paris ?","o":["Le MUCEM","Le Musée des Confluences","Le Musée du Louvre","Le Musée Fabre"],"a":2,"r":"Le Musée du Louvre, ancienne demeure royale, est l'un des plus grands établissements culturels au monde. Le MUCEM se situe à Marseille, le Musée des Confluences à Lyon et le Musée Fabre à Montpellier."},{"t":"Histoire, géographie et culture","q":"Quel monument historique se trouve sur une île en Normandie ?","o":["Le Château de Caen","Le Mont-Saint-Michel","Le Musée du Débarquement","La Tapisserie de Bayeux"],"a":1,"r":"Le Mont-Saint-Michel est une commune insulaire et un monument historique emblématique, inscrit au patrimoine mondial de l'UNESCO. Les autres sites sont situés sur le continent."},{"t":"Histoire, géographie et culture","q":"Quelle ville française fait partie des 10 plus grandes métropoles du pays ?","o":["Limoges","Poitiers","Lille","Brest"],"a":2,"r":"Lille est la préfecture du département du Nord et le siège de la Métropole européenne de Lille, l'une des zones les plus peuplées de France. Limoges, Poitiers et Brest sont des villes de taille moyenne."},{"t":"Histoire, géographie et culture","q":"Quelle île fait partie des Antilles françaises ?","o":["La Barbade","La Jamaïque","La Martinique","La République Dominicaine"],"a":2,"r":"La Martinique est un département et une région d'outre-mer (DROM). Elle est située dans l'archipel des Petites Antilles, contrairement aux autres options qui sont des États indépendants."},{"t":"Histoire, géographie et culture","q":"Quelle île est française ?","o":["Madagascar","La Corse","La Sicile","La Sardaigne"],"a":1,"r":"La Corse est une île de la mer Méditerranée ayant le statut de collectivité territoriale à statut particulier au sein de la République française. La Sicile et la Sardaigne sont italiennes, et Madagascar est un État indépendant."},{"t":"Histoire, géographie et culture","q":"Quelle est la plus haute montagne de France ?","o":["Le Mont Blanc","Le Mont Ventoux","Le Pic du Midi d'Ossau","La Meije"],"a":0,"r":"Le Mont Blanc, situé dans les Alpes, est le point culminant de la France."},{"t":"Histoire, géographie et culture","q":"Quelle île française est située dans l'océan indien ?","o":["La Guadeloupe","La Martinique","La Réunion","Tahiti"],"a":2,"r":"La Réunion est un département et région d'outre-mer situé dans l'archipel des Mascareignes, dans l'océan Indien."},{"t":"Histoire, géographie et culture","q":"Quel département français a une frontière avec le Brésil ?","o":["La Guadeloupe","La Martinique","La Guyane","Saint-Pierre-et-Miquelon"],"a":2,"r":"La Guyane est une collectivité territoriale française située en Amérique du Sud. Elle partage avec le Brésil la plus longue frontière terrestre de la France (environ 730 km)."},{"t":"Histoire, géographie et culture","q":"De quelle ville française décolle la fusée Ariane ?","o":["Toulouse","Kourou","Evry","Lyon"],"a":1,"r":"Les fusées Ariane décollent du Centre Spatial Guyanais, situé à Kourou en Guyane."},{"t":"Histoire, géographie et culture","q":"Quelle mer ou océan borde la France métropolitaine ?","o":["L'océan Pacifique","La mer Baltique","L'océan Atlantique et la mer Méditerranée","La mer Noire"],"a":2,"r":"La France métropolitaine est bordée par l'océan Atlantique, la mer Méditerranée, la Manche et la mer du Nord."},{"t":"Histoire, géographie et culture","q":"Quelle mer se situe entre la France et l'Angleterre ?","o":["La mer Méditerranée.","La mer Adriatique.","La Manche.","La mer Noire."],"a":2,"r":"La Manche est la mer qui sépare le nord-ouest de la France du sud de l'Angleterre. Elle permet notamment de relier les deux pays par le tunnel sous la Manche."},{"t":"Histoire, géographie et culture","q":"Quelle île est un département d'outre-mer français ?","o":["La Corse","Tahiti (Polynésie française)","La Guadeloupe","L'île Maurice"],"a":2,"r":"La Guadeloupe est un DROM (Département et Région d'Outre-Mer). La Corse fait partie de la France métropolitaine, Tahiti est une collectivité d'outre-mer (COM) et Maurice est un État indépendant."},{"t":"Histoire, géographie et culture","q":"Qu'est-ce que la France d'outre-mer ?","o":["Les régions du sud de la France.","Les territoires français situés hors du continent européen.","Les anciennes colonies devenues indépendantes.","L'ensemble des pays qui parlent français."],"a":1,"r":"La France d'outre-mer désigne les territoires de la République situés loin de l'Europe (Caraïbes, Océan Indien, Pacifique...)."},{"t":"Histoire, géographie et culture","q":"Quelle est la population approximative de la France ?","o":["Environ 30 millions d'habitants","Environ 50 millions d'habitants","Environ 70 millions d'habitants","Environ 90 millions d'habitants"],"a":2,"r":"La France compte environ 68 millions d'habitants. C'est l'un des pays les plus peuplés de l'Union européenne."},{"t":"Histoire, géographie et culture","q":"Quel est le principal port maritime de France ?","o":["Le port de Brest","Le port de Marseille","Le port de Nantes-Saint-Nazaire","Le port de Calais"],"a":1,"r":"Le Grand Port Maritime de Marseille est historiquement le premier port français en termes de tonnage global (marchandises)."},{"t":"Histoire, géographie et culture","q":"Combien y a-t-il de régions en France métropolitaine ?","o":["13","18","95","101"],"a":0,"r":"Depuis la réforme territoriale de 2016, la France métropolitaine compte 13 régions. Si l'on ajoute les 5 régions d'outre-mer, la France en compte 18 au total."},{"t":"Histoire, géographie et culture","q":"Quelle île française se trouve au sud-est du continent africain ?","o":["La Martinique","La Guadeloupe","La Réunion","Saint-Pierre-et-Miquelon"],"a":2,"r":"La Réunion est un Département et Région d'Outre-Mer (DROM) situé dans l'océan Indien. La Martinique et la Guadeloupe sont aux Antilles, et Saint-Pierre-et-Miquelon est au large du Canada."},{"t":"Histoire, géographie et culture","q":"Quel est le chef-lieu de la région Auvergne-Rhône-Alpes ?","o":["Clermont-Ferrand","Grenoble","Lyon","Saint-Étienne"],"a":2,"r":"Lyon est la préfecture (le chef-lieu) de la région Auvergne-Rhône-Alpes. C'est le centre administratif où siège le Conseil régional."},{"t":"Histoire, géographie et culture","q":"Quel est le chef-lieu de la région Bretagne ?","o":["Brest","Lorient","Rennes","Saint-Malo"],"a":2,"r":"Rennes est le chef-lieu et la préfecture de la région Bretagne, regroupant les services administratifs régionaux de l'État."},{"t":"Histoire, géographie et culture","q":"Quel est le chef-lieu de la région Provence-Alpes-Côte d'Azur ?","o":["Marseille","Nice","Toulon","Aix-en-Provence"],"a":0,"r":"Marseille est le chef-lieu de la région PACA. C'est la ville où se situe la préfecture de région et l'hôtel de région."},{"t":"Histoire, géographie et culture","q":"Quel est le 101ème département français depuis 2011 ?","o":["La Guyane","La Martinique","Mayotte","La Réunion"],"a":2,"r":"Mayotte est devenue le 101ème département français en 2011, accédant ainsi au statut de Département et Région d'Outre-Mer (DROM)."},{"t":"Histoire, géographie et culture","q":"Quelle région française est réputée pour ses stations de ski ?","o":["La Bretagne","La Normandie","Le Centre-Val de Loire","Auvergne-Rhône-Alpes"],"a":3,"r":"La région Auvergne-Rhône-Alpes abrite la majeure partie du massif des Alpes et la totalité du Massif central, concentrant les domaines skiables les plus célèbres au monde."},{"t":"Histoire, géographie et culture","q":"Quel fleuve traverse Paris ?","o":["La Loire","La Garonne","La Seine","Le Rhône"],"a":2,"r":"La Seine est le fleuve qui traverse Paris."},{"t":"Vivre dans la société française","q":"Où faut-il déclarer la naissance d'un enfant ?","o":["À la mairie du lieu de naissance.","À la préfecture du département.","Au centre de sécurité sociale.","Au tribunal judiciaire."],"a":0,"r":"La naissance doit être déclarée dans les 5 jours à la mairie du lieu de naissance auprès d'un officier d'état civil."},{"t":"Vivre dans la société française","q":"Quelle action peut réaliser le locataire d'un logement sans l'autorisation du propriétaire ?","o":["Casser un mur pour agrandir une pièce.","Repeindre les murs ou poser des étagères.","Sous-louer le logement à un touriste.","Transformer le logement en commerce."],"a":1,"r":"Le locataire est libre de réaliser des aménagements simples (peinture, décoration) qui ne transforment pas le bien. En revanche, les travaux de transformation (comme abattre une cloison) ou la sous-location requièrent obligatoirement l'accord écrit du propriétaire."},{"t":"Vivre dans la société française","q":"Quel mariage est reconnu légalement ?","o":["Le mariage uniquement religieux (à l'église, à la mosquée, au temple, etc.).","Le mariage civil (célébré à la mairie).","Le mariage coutumier ou traditionnel.","Le mariage contracté uniquement devant un notaire."],"a":1,"r":"En France, seul le mariage civil célébré à la mairie est juridiquement reconnu. Il doit obligatoirement être célébré avant toute cérémonie religieuse, sous peine de sanctions pénales pour le célébrant."},{"t":"Vivre dans la société française","q":"Le stationnement sur une place réservée aux personnes handicapées :","o":["Est autorisé pour tout le monde si l'arrêt ne dure que 2 minutes.","Est interdit, sauf pour les titulaires de la carte spécifique (CMI).","Est autorisé si on laisse les feux de détresse allumés.","Est autorisé si le parking est complet ailleurs."],"a":1,"r":"Il est strictement interdit de stationner sur ces places sans la carte spécifique (CMI Stationnement), même pour quelques minutes ou si l'on reste au volant. C'est une infraction (135€ d'amende)."},{"t":"Vivre dans la société française","q":"Si une machine à laver est cassée, il est possible de :","o":["Demander une indemnisation au fabricant sans preuve d'achat.","Demander au vendeur de la faire réparer ou de la remplacer.","S'en débarrasser sur le trottoir sans autorisation.","Demander à la mairie de payer les réparations."],"a":1,"r":"En vertu de la garantie légale de conformité (valable 2 ans pour un produit neuf), le vendeur est tenu de proposer la réparation ou le remplacement du bien défectueux."},{"t":"Vivre dans la société française","q":"Dans quel cas faut-il déclarer son enfant au service d'état civil ?","o":["Seulement s'il s'agit d'une adoption.","Toujours, après sa naissance.","Uniquement s'il demande la nationalité française.","Jamais, les hôpitaux s'en chargent."],"a":1,"r":"La déclaration de naissance est obligatoire pour tout enfant né en France. Elle doit être faite à la mairie du lieu de naissance dans les 5 jours suivant l'accouchement par une personne ayant assisté à la naissance (généralement le père)."},{"t":"Vivre dans la société française","q":"Quand faut-il déclarer son enfant au service d'état civil ?","o":["Dans les 5 jours suivant la naissance.","Dans les 15 jours suivant la naissance.","Dans le mois suivant la naissance.","Dans l'année suivant la naissance."],"a":0,"r":"La déclaration de naissance est obligatoire pour tout enfant. Elle doit être faite à la mairie du lieu de naissance dans les 5 jours qui suivent l'accouchement."},{"t":"Vivre dans la société française","q":"Quel numéro d'urgence permet d'appeler la police ?","o":["15","17","18","115"],"a":1,"r":"Le 17 est le numéro dédié à la police et à la gendarmerie pour les urgences immédiates. On peut aussi utiliser le 112, numéro d'urgence européen, accessible gratuitement partout dans l'Union européenne."},{"t":"Vivre dans la société française","q":"Quel numéro d'urgence permet d'appeler le SAMU ?","o":["17","18","15","114"],"a":2,"r":"Le numéro d'urgence pour contacter le SAMU (Service d'Aide Médicale Urgente) est le 15."},{"t":"Vivre dans la société française","q":"Auprès de quelle institution les parents peuvent inscrire leurs enfants à l'école publique ?","o":["La préfecture","Le rectorat","La mairie","Le conseil départemental"],"a":2,"r":"L'inscription aux écoles maternelles et élémentaires (premier degré) s'effectue à la mairie. Pour le collège et le lycée, elle dépend de l'académie (rectorat)."},{"t":"Vivre dans la société française","q":"En cas de divorce, qui exerce l'autorité parentale ?","o":["Seulement le parent chez qui l'enfant a sa résidence principale.","Seulement le parent qui verse la pension alimentaire.","Les deux parents, sauf décision contraire du juge.","Le juge aux affaires familiales."],"a":2,"r":"L'autorité parentale est par principe exercée en commun par les deux parents, même en cas de divorce ou de séparation, sauf décision contraire du juge visant à protéger l'intérêt de l'enfant."},{"t":"Vivre dans la société française","q":"Quelle aide permet aux personnes qui ont des difficultés financières d'avoir un avocat ?","o":["La mutuelle santé","L'aide juridictionnelle","Le RSA","L'assurance maladie"],"a":1,"r":"L'aide juridictionnelle prend en charge tout ou partie des frais d'avocat pour les personnes aux revenus modestes."},{"t":"Vivre dans la société française","q":"Qui peut demander le divorce de personnes mariées ?","o":["Uniquement le procureur de la République.","Uniquement le juge.","Un ou les deux époux.","Les parents des époux."],"a":2,"r":"Le divorce peut être demandé par un seul des époux (divorce pour altération définitive du lien conjugal, pour faute) ou par les deux époux (divorce par consentement mutuel). Il s'agit d'une démarche personnelle et non d'une initiative d'une tierce partie."},{"t":"Vivre dans la société française","q":"Auprès de quel organisme faut-il demander le remboursement des frais de santé ?","o":["La CAF","La CPAM","L'URSSAF","Le Trésor Public"],"a":1,"r":"La CPAM (Caisse Primaire d'Assurance Maladie) gère les remboursements de santé. Elle représente la branche 'Maladie' de la Sécurité sociale, alors que la CAF gère les prestations familiales."},{"t":"Vivre dans la société française","q":"La contraception :","o":["Est entièrement à la charge financière de l'utilisateur.","Est un droit pris en charge par l'Assurance Maladie.","Nécessite obligatoirement l'accord parental pour les mineures.","N'est autorisée que pour les personnes de nationalité française."],"a":1,"r":"En France, la contraception est un droit. Elle est prise en charge par l'Assurance Maladie et est entièrement gratuite et anonyme pour les mineures (sans accord parental requis)."},{"t":"Vivre dans la société française","q":"Qu'est-ce que le principe de confidentialité dans le domaine de la santé ?","o":["L'employeur peut exiger de connaître la maladie d'un salarié.","Le patient n'a pas le droit d'accéder à son dossier médical.","L'hôpital peut partager librement les données d'une personne.","Le médecin ne doit révéler aucune information sur son patient."],"a":3,"r":"C'est ce que l'on nomme le 'secret médical'. En France, les professionnels de santé ont l'obligation absolue de protéger la vie privée des patients et de ne jamais divulguer leurs informations médicales."},{"t":"Vivre dans la société française","q":"À quoi sert la carte Vitale ?","o":["À prouver son identité.","À attester de son droit au RSA.","À simplifier le remboursement des frais de santé.","À justifier de la régularité de son séjour."],"a":2,"r":"La carte Vitale contient les informations nécessaires à la prise en charge de vos frais de santé par l'Assurance Maladie."},{"t":"Vivre dans la société française","q":"À quoi sert une mutuelle santé ?","o":["À remplacer l'Assurance Maladie.","À rembourser le ticket modérateur et d'éventuels dépassements d'honoraires.","À payer uniquement les consultations chez le médecin généraliste.","À obtenir des indemnités en cas d'arrêt de travail prolongé."],"a":1,"r":"La mutuelle santé complète les remboursements de l'Assurance Maladie, en prenant notamment en charge le ticket modérateur et d'éventuels dépassements d'honoraires."},{"t":"Vivre dans la société française","q":"Qu'est-ce que le tiers payant ?","o":["Le paiement d'une partie des frais par le patient.","Le droit pour le patient de ne pas avancer les frais médicaux pris en charge.","Le remboursement des frais par l'employeur.","Le paiement différé des soins."],"a":1,"r":"Le tiers payant permet de ne pas avancer certaines dépenses de santé (médicaments, consultations) lorsque le paiement est directement effectué par l'Assurance Maladie et la mutuelle."},{"t":"Vivre dans la société française","q":"L'inscription à l'Assurance maladie est :","o":["Facultative pour les travailleurs indépendants.","Obligatoire pour tous les résidents réguliers.","Réservée uniquement aux citoyens français.","Soumise à des conditions de revenus."],"a":1,"r":"La Protection Universelle Maladie (PUMA) rend la Sécurité sociale obligatoire pour toute personne résidant en France de manière stable et régulière, sans condition de nationalité ou de revenus."},{"t":"Vivre dans la société française","q":"L'avortement est-il possible en France ?","o":["Non, c'est une pratique interdite par la loi.","Oui, c'est une liberté garantie par la Constitution, dans les conditions prévues par la loi.","Uniquement en cas de danger immédiat pour la vie de la mère.","Seulement si la personne dispose de la nationalité française."],"a":1,"r":"L'interruption volontaire de grossesse (IVG) est une liberté garantie par la Constitution française. Elle est accessible à toute femme, majeure ou mineure, dans les délais légaux."},{"t":"Vivre dans la société française","q":"Travailler sans être déclaré est :","o":["Une pratique autorisée pour les petits boulots.","Un droit contractuel réservé aux étudiants.","Une infraction pénale appelée travail dissimulé.","Un aménagement contractuel autorisé d'un commun accord."],"a":2,"r":"Le travail dissimulé (ou travail au noir) est un délit pénal. Il est lourdement sanctionné car il prive le travailleur de sa protection sociale (chômage, retraite, maladie) et l'État de cotisations."},{"t":"Vivre dans la société française","q":"Qu'est-ce que le SMIC ?","o":["Le Salaire Moyen d'Insertion Citoyenne.","Le Salaire Minimum Interprofessionnel de Croissance.","Le Système Mutualisé des Indemnités de Congés.","Le Statut Minimum des Indépendants et Commerçants."],"a":1,"r":"Le SMIC est le salaire horaire minimum en dessous duquel aucun salarié majeur ne peut être payé en France."},{"t":"Vivre dans la société française","q":"Quelle est la première démarche à réaliser pour chercher un emploi ?","o":["Se syndiquer auprès d'une organisation représentative.","S'inscrire à France Travail (anciennement Pôle emploi).","S'adresser à l'Inspection du travail.","Déposer une demande d'autorisation de travail à la mairie."],"a":1,"r":"S'inscrire à France Travail (anciennement Pôle emploi) est la démarche institutionnelle fondamentale en France pour être accompagné dans sa recherche d'emploi et accéder aux services de formation."},{"t":"Vivre dans la société française","q":"Quelle est la durée légale du temps de travail par semaine ?","o":["30 heures","35 heures","40 heures","45 heures"],"a":1,"r":"La durée légale du travail est de 35 heures par semaine en France."},{"t":"Vivre dans la société française","q":"Qui peut demander un congé parental d'éducation ?","o":["Seulement la mère de l'enfant.","Seulement le père de l'enfant.","Le père, la mère, ou les deux parents.","Uniquement les agents de la fonction publique."],"a":2,"r":"Le congé parental d'éducation est un droit ouvert à tout salarié (père, mère ou les deux parents simultanément ou successivement) justifiant d'au moins un an d'ancienneté dans l'entreprise à la naissance de l'enfant."},{"t":"Vivre dans la société française","q":"Une personne étrangère, en situation régulière, peut créer son entreprise :","o":["Jamais.","Seulement si son conjoint est français.","Oui, sous certaines conditions liées à son titre de séjour.","Uniquement dans des secteurs d'activité spécifiques."],"a":2,"r":"Les étrangers en situation régulière ont le droit de créer une entreprise en France, sous réserve d'avoir un titre de séjour adapté."},{"t":"Vivre dans la société française","q":"Une femme peut-elle créer son entreprise ?","o":["Uniquement si elle est célibataire.","Oui, dans les mêmes conditions qu'un homme.","Seulement avec l'accord de son conjoint.","Uniquement si elle exerce une profession libérale."],"a":1,"r":"Depuis 1965, une femme peut créer une entreprise et ouvrir un compte bancaire sans l'autorisation de son conjoint. Elle a, dans tous les cas, les mêmes droits qu'un homme."},{"t":"Vivre dans la société française","q":"Quels sont les textes qui définissent les règles au travail ?","o":["Le Code de la Sécurité sociale.","Le Code de commerce.","Le Code du travail.","Le Code de procédure civile."],"a":2,"r":"Le Code du travail regroupe l'essentiel des textes législatifs et réglementaires applicables aux relations entre employeurs et salariés."},{"t":"Vivre dans la société française","q":"Quelles sont les affaires traitées par le conseil de prud'hommes ?","o":["Les litiges liés à la consommation.","Les litiges entre employeurs et salariés.","Les conflits de voisinage.","Les divorces."],"a":1,"r":"Le conseil de prud'hommes est une juridiction chargée de régler les litiges individuels du travail."},{"t":"Vivre dans la société française","q":"Qui a le droit de se syndiquer ?","o":["Uniquement les employés du secteur privé.","Seulement les fonctionnaires de l'État.","Tous les travailleurs et les retraités.","Seulement les cadres d'entreprise."],"a":2,"r":"La liberté syndicale est un droit constitutionnel garanti à tous les travailleurs, qu'ils soient salariés, fonctionnaires ou indépendants, ainsi qu'aux retraités pour défendre leurs droits."},{"t":"Vivre dans la société française","q":"Est-il possible de licencier une femme enceinte ou en congé maternité, en raison de sa grossesse ?","o":["Oui, si l'entreprise est en difficulté.","Non, cela est interdit par la loi.","Seulement après la fin de son congé.","Avec une autorisation spéciale du ministère du Travail."],"a":1,"r":"La loi protège les femmes enceintes et celles en congé maternité contre le licenciement lié à leur état."},{"t":"Vivre dans la société française","q":"L'instruction des enfants est obligatoire de :","o":["3 ans à 16 ans.","6 ans à 16 ans.","3 ans à 18 ans.","6 ans à 18 ans."],"a":0,"r":"L'instruction est obligatoire pour tout enfant, français ou étranger, à partir de 3 ans jusqu'à 16 ans."},{"t":"Vivre dans la société française","q":"Des parents ne respectent pas l'obligation d'instruction pour leurs enfants. Quelle sanction maximale risquent-ils ?","o":["Une simple amende de 135 euros.","6 mois de prison et 7 500 euros d'amende.","La suppression définitive des allocations familiales.","Une interdiction de sortie du territoire."],"a":1,"r":"Le non-respect de l'obligation d'instruction sans motif légitime est un délit puni d'une peine maximale de 6 mois de prison et de 7 500 euros d'amende."},{"t":"Vivre dans la société française","q":"Quelle est la définition de l'autorité parentale ?","o":["Un droit de propriété absolu des parents sur la personne de leur enfant.","L'ensemble des droits et devoirs des parents envers leurs enfants.","Le pouvoir de décision du père seul.","La responsabilité d'éduquer les enfants dans une école spécifique."],"a":1,"r":"L'autorité parentale n'est pas un pouvoir absolu, mais un ensemble de droits et de devoirs visant à protéger la sécurité, la santé et la moralité de l'enfant jusqu'à sa majorité."},{"t":"Vivre dans la société française","q":"Quel motif d'absence est accepté par l'école ?","o":["Une convenance personnelle.","Un départ anticipé en vacances.","Une maladie de l'enfant ou un événement familial grave.","Une activité de loisir exceptionnelle."],"a":2,"r":"Seuls les motifs légitimes (maladie, réunion solennelle de famille, empêchement lié aux transports) sont acceptés par l'administration scolaire."},{"t":"Vivre dans la société française","q":"Jusqu'à quel âge l'école est-elle obligatoire ?","o":["14 ans","16 ans","18 ans","20 ans"],"a":1,"r":"L'instruction est obligatoire jusqu'à 16 ans révolus. À noter qu'il existe désormais une obligation de formation supplémentaire jusqu'à 18 ans."},{"t":"Vivre dans la société française","q":"À quel âge commence l'instruction obligatoire des enfants ?","o":["À 2 ans.","À 3 ans.","À 5 ans.","À 6 ans."],"a":1,"r":"Depuis la rentrée 2019 (loi pour une École de la confiance), l'instruction est obligatoire dès l'âge de 3 ans (école maternelle), alors qu'elle débutait auparavant à 6 ans."},{"t":"Culture","q":"Comment s'appellent les établissements scolaires que les élèves intègrent après l'école élémentaire ?","o":["Le lycée","L'école moyenne","Le collège","L'université"],"a":2,"r":"En France, après l'école élémentaire, les élèves intègrent le collège pour le premier cycle du second degré (de la classe de 6ème à la 3ème)."},{"t":"Culture","q":"En tant que parent d'élève, il est possible de :","o":["Participer aux instances représentatives comme le conseil d'école ou d'administration","Décider seul des programmes d'enseignement et des méthodes pédagogiques","Demander le licenciement immédiat d'un enseignant en cas de désaccord","S'opposer à l'obligation de scolarisation de son enfant jusqu'à 16 ans"],"a":0,"r":"Les parents sont membres de la communauté éducative et participent à la vie scolaire via leurs représentants élus aux conseils d'école (primaire) ou d'administration (secondaire)."},{"t":"Culture","q":"Quelle instruction est prévue pour les enfants qui ne parlent pas français ?","o":["Une scolarisation immédiate en classe ordinaire sans aucun accompagnement","Un dispositif spécifique de soutien linguistique favorisant l'inclusion","L'obligation d'obtenir un certificat de maîtrise du français avant toute inscription","Une scolarisation obligatoirement en milieu privé à la charge des parents"],"a":1,"r":"La France garantit le droit à l'éducation pour tous. Les élèves non francophones sont accueillis dans des classes spécifiques pour apprendre le français tout en étant intégrés progressivement en classe ordinaire."},{"t":"République","q":"S'agissant de l'accueil des enfants en situation de handicap à l'école, laquelle des propositions est vraie ?","o":["L'établissement peut refuser l'inscription si le handicap nécessite des aménagements trop coûteux","L'école a l'obligation de s'adapter pour garantir une scolarisation inclusive","La scolarisation en milieu ordinaire est conditionnée par le paiement d'une contribution familiale","L'obligation d'accessibilité des locaux ne s'applique qu'aux établissements privés"],"a":1,"r":"Le principe de l'école inclusive, renforcé par la loi de 2005, impose aux établissements scolaires de s'adapter (matériel, aide humaine) pour accueillir tous les élèves sans discrimination liée au handicap."},{"t":"République","q":"Depuis le 1er juillet 2021, quelle est la durée du congé paternité ?","o":["11 jours calendaires","14 jours calendaires","21 jours calendaires","28 jours calendaires"],"a":3,"r":"La durée totale accordée au second parent est de 28 jours. Elle cumule 3 jours de congé de naissance (à la charge de l'employeur) et 25 jours de congé de paternité (indemnisés par la Sécurité sociale)."},{"t":"République","q":"Est-ce possible de punir physiquement ses enfants ?","o":["Oui, au nom du droit de correction reconnu par l'autorité parentale","Non, la loi interdit toute forme de violence éducative ordinaire (physique ou psychique)","Seulement si la punition ne laisse aucune trace visible sur le corps","Oui, si cela est justifié par un comportement grave de l'enfant"],"a":1,"r":"Depuis 2019, le Code civil stipule que l'autorité parentale s'exerce sans violences physiques ou psychologiques. La France interdit ainsi toute forme de châtiment corporel."}];</script>
<script>
const PASS_THRESHOLD = 0.8;
const LETTERS = ['A', 'B', 'C', 'D'];
const THEME_LABELS = {
  'République': 'Principes et valeurs',
  'Principes et valeurs de la République française': 'Principes et valeurs',
  'Laïcité et République': 'Laïcité',
  'Institutions': 'Institutions',
  'Système institutionnel et politique': 'Institutions',
  'Union européenne': 'Union européenne',
  'Droits et devoirs': 'Droits et devoirs',
  'Histoire, géographie et culture': 'Histoire & culture',
  'Histoire et Valeurs': 'Histoire & valeurs',
  'Culture': 'Culture',
  'Vivre dans la société française': 'Vivre en France',
};

let allQuestions = [];
let session = { mode: '', questions: [], index: 0, answers: [], isExam: false };
let initialized = false;

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function showError(msg) {
  const status = document.getElementById('offline-status');
  if (status) {
    status.textContent = 'Erreur : ' + msg;
    status.className = 'offline-status offline';
  }
  const grid = document.querySelector('.mode-grid');
  if (grid) grid.innerHTML = '<p style="color:#ef4444">Erreur de chargement des questions.</p>';
}

function safeStorageGet(key, fallback) {
  try { return localStorage.getItem(key); } catch (e) { return fallback; }
}

function safeStorageSet(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* iOS file:// may block storage */ }
}

function init() {
  if (initialized) return;
  initialized = true;

  try {
    allQuestions = window.QUESTIONS_DATA || [];
    if (!allQuestions.length) throw new Error('questions introuvables');
    populateThemes();
    renderPersistentStats();
    registerSW();
    updateOfflineStatus();
  } catch (e) {
    console.error(e);
    showError(e.message || 'chargement impossible');
    return;
  }

  $$('.mode-btn').forEach((btn) => btn.addEventListener('click', () => startSession(btn.dataset.mode)));
  $('#btn-quit').addEventListener('click', () => { if (confirm('Quitter ?')) showScreen('home'); });
  $('#btn-next').addEventListener('click', nextQuestion);
  $('#btn-finish').addEventListener('click', showResults);
  $('#btn-retry').addEventListener('click', () => startSession(session.mode));
  $('#btn-home').addEventListener('click', () => showScreen('home'));
}

function boot() {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
}

function populateThemes() {
  const select = $('#theme-select');
  if (!select) return;
  select.length = 1;
  [...new Set(allQuestions.map((q) => q.t))].sort().forEach((t) => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = THEME_LABELS[t] || t;
    select.appendChild(opt);
  });
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startSession(mode) {
  const themeFilter = $('#theme-select').value;
  let pool = themeFilter ? allQuestions.filter((q) => q.t === themeFilter) : [...allQuestions];
  if (pool.length < 5) { alert('Pas assez de questions pour ce thème.'); return; }

  let count, isExam = false;
  if (mode === 'training') { count = Math.min(20, pool.length); }
  else if (mode === 'training-all') { count = pool.length; }
  else if (mode === 'exam-20') { count = Math.min(20, pool.length); isExam = true; }
  else { count = Math.min(40, pool.length); isExam = true; }

  session = { mode, questions: shuffle(pool).slice(0, count), index: 0, answers: [], isExam };
  showScreen('quiz');
  renderQuestion();
}

function showScreen(name) {
  $$('.screen').forEach((s) => s.classList.remove('active'));
  $(`#screen-${name}`).classList.add('active');
  if (name === 'home') renderPersistentStats();
}

function renderQuestion() {
  const q = session.questions[session.index];
  const total = session.questions.length;
  $('#progress-bar').style.width = `${(session.index / total) * 100}%`;
  $('#progress-text').textContent = `${session.index + 1} / ${total}`;
  $('#theme-badge').textContent = THEME_LABELS[q.t] || q.t;
  $('#question-text').textContent = q.q;
  $('#options').innerHTML = '';
  q.o.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span>${text}</span>`;
    btn.addEventListener('click', () => selectAnswer(i));
    $('#options').appendChild(btn);
  });
  $('#feedback').classList.add('hidden');
  $('#btn-next').classList.add('hidden');
  $('#btn-finish').classList.add('hidden');
}

function selectAnswer(choice) {
  const q = session.questions[session.index];
  const isCorrect = choice === q.a;
  $$('.option-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.a) btn.classList.add('correct');
    else if (i === choice && !isCorrect) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });
  session.answers.push({ questionIndex: session.index, choice, correct: isCorrect, question: q });

  if (session.isExam) {
    setTimeout(() => session.index >= session.questions.length - 1 ? showResults() : nextQuestion(), 400);
    return;
  }

  const header = $('#feedback-header');
  $('#feedback').classList.remove('hidden');
  if (isCorrect) {
    header.textContent = '✓ Bonne réponse !';
    header.className = 'feedback-header correct';
  } else {
    header.textContent = `✗ Mauvaise réponse — ${LETTERS[q.a]} : ${q.o[q.a]}`;
    header.className = 'feedback-header wrong';
  }
  $('#explanation').textContent = q.r || '';
  (session.index >= session.questions.length - 1 ? $('#btn-finish') : $('#btn-next')).classList.remove('hidden');
}

function nextQuestion() {
  session.index++;
  if (session.index >= session.questions.length) showResults();
  else renderQuestion();
}

function showResults() {
  const total = session.answers.length;
  const correct = session.answers.filter((a) => a.correct).length;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const passed = pct >= PASS_THRESHOLD * 100;
  const circle = $('#score-circle');
  circle.className = `score-circle ${passed ? 'pass' : 'fail'}`;
  $('#score-value').textContent = `${pct}%`;
  $('#score-label').textContent = `${correct} / ${total}`;

  if (session.isExam) {
    const needed = Math.ceil(total * PASS_THRESHOLD);
    $('#results-title').textContent = passed ? '🎉 Examen réussi !' : 'Examen non validé';
    $('#results-subtitle').textContent = passed
      ? `${correct}/${total} (minimum : ${needed})`
      : `${correct}/${total}. Minimum : ${needed} (${PASS_THRESHOLD * 100}%)`;
  } else {
    $('#results-title').textContent = 'Session terminée';
    $('#results-subtitle').textContent = `${correct} bonnes réponses sur ${total}`;
  }

  $('#stats-grid').innerHTML = `
    <div class="stat-card good"><div class="val">${correct}</div><div class="lbl">Correctes</div></div>
    <div class="stat-card bad"><div class="val">${total - correct}</div><div class="lbl">Incorrectes</div></div>
    <div class="stat-card"><div class="val">${total}</div><div class="lbl">Total</div></div>`;

  renderThemeBreakdown();
  renderReview();
  saveStats(correct, total, session.isExam, passed);
  showScreen('results');
}

function renderThemeBreakdown() {
  const byTheme = {};
  session.answers.forEach((a) => {
    const t = a.question.t;
    if (!byTheme[t]) byTheme[t] = { correct: 0, total: 0 };
    byTheme[t].total++;
    if (a.correct) byTheme[t].correct++;
  });
  const entries = Object.entries(byTheme).sort((a, b) => a[0].localeCompare(b[0]));
  $('#theme-breakdown').innerHTML = entries.length
    ? '<h3>Par thème</h3>' + entries.map(([theme, s]) => {
        const pct = Math.round((s.correct / s.total) * 100);
        const color = pct >= 80 ? 'var(--success)' : pct >= 50 ? 'var(--warning)' : 'var(--error)';
        return `<div class="theme-row"><span class="name">${THEME_LABELS[theme] || theme}</span>
          <div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${color}"></div></div>
          <span class="pct">${s.correct}/${s.total}</span></div>`;
      }).join('')
    : '';
}

function renderReview() {
  $('#review-list').innerHTML = session.answers.map((a, i) => {
    const q = a.question;
    return `<div class="review-item ${a.correct ? 'correct-item' : 'wrong-item'}">
      <div class="q-num">Q${i + 1} · ${THEME_LABELS[q.t] || q.t}</div>
      <div class="q-text">${q.q}</div>
      <div class="ans-line">Votre réponse : <strong>${LETTERS[a.choice]} — ${q.o[a.choice]}</strong></div>
      ${!a.correct ? `<div class="ans-line">Bonne réponse : <strong>${LETTERS[q.a]} — ${q.o[q.a]}</strong></div>` : ''}
      ${q.r ? `<div class="ans-line" style="margin-top:0.375rem">${q.r}</div>` : ''}
    </div>`;
  }).join('');
}

function saveStats(correct, total, isExam, passed) {
  try {
    const stats = JSON.parse(safeStorageGet('civique_stats', '{"sessions":[],"totalCorrect":0,"totalQuestions":0,"examsPassed":0,"examsTotal":0}'));
    stats.sessions.push({ date: new Date().toISOString(), mode: session.mode, correct, total, passed: isExam ? passed : null });
    stats.totalCorrect += correct;
    stats.totalQuestions += total;
    if (isExam) { stats.examsTotal++; if (passed) stats.examsPassed++; }
    stats.sessions = stats.sessions.slice(-50);
    safeStorageSet('civique_stats', JSON.stringify(stats));
  } catch (e) { /* ignore storage errors offline */ }
}

function renderPersistentStats() {
  const el = $('#stats-summary');
  if (!el) return;
  let stats = null;
  try { stats = JSON.parse(safeStorageGet('civique_stats', 'null')); } catch (e) { return; }
  if (!stats?.sessions?.length) { el.innerHTML = ''; return; }
  const pct = Math.round((stats.totalCorrect / stats.totalQuestions) * 100);
  el.innerHTML = `<h3>📊 Statistiques</h3>
    <div class="stat-row"><span>Sessions</span><span>${stats.sessions.length}</span></div>
    <div class="stat-row"><span>Taux global</span><span>${pct}% (${stats.totalCorrect}/${stats.totalQuestions})</span></div>
    ${stats.examsTotal ? `<div class="stat-row"><span>Examens réussis</span><span>${stats.examsPassed}/${stats.examsTotal}</span></div>` : ''}`;
}

function registerSW() {}

function updateOfflineStatus() {
  const el = $('#offline-status');
  if (!el) return;
  el.textContent = '✈️ 100% hors-ligne — ' + allQuestions.length + ' questions';
  el.className = 'offline-status ' + (navigator.onLine ? 'online' : 'offline');
}

window.addEventListener('online', updateOfflineStatus);
window.addEventListener('offline', updateOfflineStatus);
boot();

</script>
</body>
</html>
