<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#002395">
  <meta name="description" content="Entraînement à l'examen civique français - Naturalisation 2026">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Examen Civique — Naturalisation</title>
        <style>
:root {
  --blue: #002395; --white: #ffffff; --red: #ED2939;
  --bg: #0f172a; --surface: #1e293b; --surface-2: #334155;
  --text: #f1f5f9; --text-muted: #94a3b8;
  --success: #22c55e; --error: #ef4444; --warning: #f59e0b;
  --radius: 12px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }
#app { max-width: 640px; margin: 0 auto; min-height: 100dvh; }
.screen { display: none; flex-direction: column; min-height: 100dvh; padding: 1rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom)); }
.screen.active { display: flex; }
.tricolor-bar { height: 4px; background: linear-gradient(90deg, var(--blue) 33%, var(--white) 33%, var(--white) 66%, var(--red) 66%); border-radius: 2px; margin-bottom: 1.5rem; }
.hero { text-align: center; padding: 1.5rem 0 1rem; }
.hero h1 { font-size: 1.75rem; font-weight: 700; }
.subtitle { color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem; }
.info-card { background: var(--surface); border-radius: var(--radius); padding: 0.875rem 1rem; margin: 1rem 0; font-size: 0.8125rem; color: var(--text-muted); border-left: 3px solid var(--blue); }
.info-card strong { color: var(--text); }
.mode-grid { display: flex; flex-direction: column; gap: 0.75rem; margin: 1rem 0; }
.mode-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 0.25rem; padding: 1rem 1.25rem; background: var(--surface); border: 1px solid var(--surface-2); border-radius: var(--radius); color: var(--text); cursor: pointer; text-align: left; width: 100%; }
.mode-btn.training { border-left: 4px solid var(--success); }
.mode-btn.exam { border-left: 4px solid var(--warning); }
.mode-icon { font-size: 1.5rem; }
.mode-title { font-weight: 600; font-size: 1rem; }
.mode-desc { font-size: 0.75rem; color: var(--text-muted); }
.theme-filter { margin: 1rem 0; }
.theme-filter label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.375rem; }
.theme-filter select { width: 100%; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--surface-2); border-radius: var(--radius); color: var(--text); font-size: 0.875rem; }
.offline-status { text-align: center; font-size: 0.75rem; padding: 0.5rem; border-radius: 8px; margin: 0.5rem 0; }
.offline-status.online { color: var(--success); background: rgba(34,197,94,0.1); }
.offline-status.offline { color: var(--warning); background: rgba(245,158,11,0.12); }
.stats-summary { background: var(--surface); border-radius: var(--radius); padding: 1rem; margin: 1rem 0; font-size: 0.8125rem; }
.stats-summary .stat-row { display: flex; justify-content: space-between; padding: 0.25rem 0; color: var(--text-muted); }
.attribution { text-align: center; font-size: 0.6875rem; color: var(--text-muted); margin-top: auto; padding: 1.5rem 0 0.5rem; line-height: 1.6; }
.attribution a { color: #60a5fa; text-decoration: none; }
.quiz-header { display: flex; align-items: center; gap: 0.75rem; padding-bottom: 1rem; }
.btn-icon { background: var(--surface); border: none; color: var(--text-muted); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
.progress-wrap { flex: 1; height: 6px; background: var(--surface); border-radius: 3px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--blue), #3b82f6); transition: width 0.4s; width: 0; }
.progress-text { font-size: 0.75rem; color: var(--text-muted); min-width: 3.5rem; text-align: right; }
.quiz-body { flex: 1; overflow-y: auto; padding: 0.5rem 0; }
.theme-badge { display: inline-block; font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; color: #60a5fa; background: rgba(59,130,246,0.15); padding: 0.25rem 0.625rem; border-radius: 999px; margin-bottom: 0.75rem; }
.question-text { font-size: 1.125rem; font-weight: 600; line-height: 1.5; margin-bottom: 1.25rem; }
.options { display: flex; flex-direction: column; gap: 0.625rem; }
.option-btn { display: flex; align-items: flex-start; gap: 0.75rem; padding: 0.875rem 1rem; background: var(--surface); border: 2px solid var(--surface-2); border-radius: var(--radius); color: var(--text); font-size: 0.9375rem; line-height: 1.4; cursor: pointer; text-align: left; width: 100%; }
.option-btn:disabled { cursor: default; }
.option-btn .letter { flex-shrink: 0; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: var(--surface-2); border-radius: 50%; font-size: 0.75rem; font-weight: 700; }
.option-btn.correct { border-color: var(--success); background: rgba(34,197,94,0.12); }
.option-btn.correct .letter { background: var(--success); color: white; }
.option-btn.wrong { border-color: var(--error); background: rgba(239,68,68,0.12); }
.option-btn.wrong .letter { background: var(--error); color: white; }
.option-btn.dimmed { opacity: 0.45; }
.feedback { margin-top: 1.25rem; padding: 1rem; background: var(--surface); border-radius: var(--radius); border-left: 3px solid var(--blue); }
.feedback.hidden { display: none; }
.feedback-header { font-weight: 600; margin-bottom: 0.5rem; }
.feedback-header.correct { color: var(--success); }
.feedback-header.wrong { color: var(--error); }
.explanation { font-size: 0.875rem; color: var(--text-muted); line-height: 1.6; }
.quiz-footer { padding-top: 1rem; }
.btn-primary, .btn-secondary { width: 100%; padding: 0.875rem; border: none; border-radius: var(--radius); font-size: 1rem; font-weight: 600; cursor: pointer; }
.btn-primary { background: linear-gradient(135deg, var(--blue), #1d4ed8); color: white; }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--surface-2); margin-bottom: 0.5rem; }
.hidden { display: none !important; }
.results-header { text-align: center; padding: 1.5rem 0; }
.score-circle { width: 140px; height: 140px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 1rem; border: 6px solid var(--surface-2); }
.score-circle.pass { border-color: var(--success); }
.score-circle.fail { border-color: var(--error); }
.score-value { font-size: 2rem; font-weight: 700; }
.score-label { font-size: 0.75rem; color: var(--text-muted); }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.625rem; margin: 1rem 0; }
.stat-card { background: var(--surface); border-radius: var(--radius); padding: 0.875rem; text-align: center; }
.stat-card .val { font-size: 1.5rem; font-weight: 700; }
.stat-card .lbl { font-size: 0.6875rem; color: var(--text-muted); }
.stat-card.good .val { color: var(--success); }
.stat-card.bad .val { color: var(--error); }
.theme-breakdown { background: var(--surface); border-radius: var(--radius); padding: 1rem; margin: 1rem 0; }
.theme-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 0.75rem; }
.theme-row .name { flex: 1; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.theme-row .bar-wrap { flex: 2; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.theme-row .bar { height: 100%; border-radius: 3px; }
.theme-row .pct { min-width: 2.5rem; text-align: right; font-weight: 600; }
.review-item { background: var(--surface); border-radius: var(--radius); padding: 0.875rem; margin-bottom: 0.5rem; font-size: 0.8125rem; border-left: 3px solid var(--surface-2); }
.review-item.correct-item { border-left-color: var(--success); }
.review-item.wrong-item { border-left-color: var(--error); }
.review-item .q-num { font-size: 0.6875rem; color: var(--text-muted); }
.review-item .q-text { font-weight: 500; margin: 0.25rem 0; }
.review-item .ans-line { font-size: 0.75rem; color: var(--text-muted); line-height: 1.5; }
.results-footer { padding-top: 1rem; margin-top: auto; }

</style>
</head>
<body>
  <div id="app">
    <section id="screen-home" class="screen active">
      <header class="hero">
        <div class="tricolor-bar"></div>
        <h1>Examen Civique</h1>
        <p class="subtitle">Naturalisation française · 258 questions officielles</p>
      </header>

      <div class="info-card">
        <p>L'examen officiel : <strong>40 questions</strong> en 45 min · Seuil de réussite : <strong>80%</strong> (32/40)</p>
      </div>

      <div class="mode-grid">
        <button class="mode-btn training" data-mode="training">
          <span class="mode-icon">📚</span>
          <span class="mode-title">Entraînement — 20 Q</span>
          <span class="mode-desc">Réponse immédiate + explication</span>
        </button>
        <button class="mode-btn training" data-mode="training-all">
          <span class="mode-icon">📖</span>
          <span class="mode-title">Révision complète — 258 Q</span>
          <span class="mode-desc">Toutes les questions · réponse immédiate</span>
        </button>
        <button class="mode-btn exam" data-mode="exam-20">
          <span class="mode-icon">📝</span>
          <span class="mode-title">Examen blanc — 20 Q</span>
          <span class="mode-desc">Résultats à la fin uniquement</span>
        </button>
        <button class="mode-btn exam" data-mode="exam-40">
          <span class="mode-icon">🎯</span>
          <span class="mode-title">Examen blanc — 40 Q</span>
          <span class="mode-desc">Format officiel complet</span>
        </button>
      </div>

      <div class="theme-filter">
        <label for="theme-select">Filtrer par thème (optionnel)</label>
        <select id="theme-select">
          <option value="">Tous les thèmes</option>
        </select>
      </div>

      <p class="offline-status online" id="offline-status">Chargement…</p>
      <div class="stats-summary" id="stats-summary"></div>

      <footer class="attribution">
        Questions officielles — Ministère de l'Intérieur<br>
        Réponses suggérées par <a href="https://leqcmcivique.fr" target="_blank" rel="noopener">leqcmcivique.fr</a>
      </footer>
    </section>

    <section id="screen-quiz" class="screen">
      <header class="quiz-header">
        <button id="btn-quit" class="btn-icon" aria-label="Quitter">✕</button>
        <div class="progress-wrap">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <span class="progress-text" id="progress-text">1 / 20</span>
      </header>

      <div class="quiz-body">
        <span class="theme-badge" id="theme-badge"></span>
        <h2 class="question-text" id="question-text"></h2>
        <div class="options" id="options"></div>
        <div class="feedback hidden" id="feedback">
          <div class="feedback-header" id="feedback-header"></div>
          <p class="explanation" id="explanation"></p>
        </div>
      </div>

      <footer class="quiz-footer">
        <button id="btn-next" class="btn-primary hidden">Question suivante</button>
        <button id="btn-finish" class="btn-primary hidden">Voir les résultats</button>
      </footer>
    </section>

    <section id="screen-results" class="screen">
      <header class="results-header">
        <div class="score-circle" id="score-circle">
          <span class="score-value" id="score-value">0%</span>
          <span class="score-label" id="score-label"></span>
        </div>
        <h2 id="results-title">Résultats</h2>
        <p id="results-subtitle"></p>
      </header>

      <div class="stats-grid" id="stats-grid"></div>
      <div class="theme-breakdown" id="theme-breakdown"></div>

      <div class="review-section" id="review-section">
        <h3>Correction détaillée</h3>
        <div id="review-list"></div>
      </div>

      <footer class="results-footer">
        <button id="btn-retry" class="btn-secondary">Recommencer</button>
        <button id="btn-home" class="btn-primary">Menu principal</button>
      </footer>
    </section>
  </div>

  <script>window.QUESTIONS_DATA=[{"t":"République","q":"Complétez les paroles de la Marseillaise \"Allons enfants de la patrie...\"","o":["Le jour de gloire est arrivé","Formez vos bataillons","Marchons vers la liberté","Amour sacré de la patrie"],"a":0,"r":"Il s'agit du début du premier couplet de 'La Marseillaise', l'hymne national français composé par Rouget de Lisle en 1792."},{"t":"République","q":"Dans le cadre d'un entretien d'embauche, que peut-on demander au candidat ?","o":["Sa religion ou ses croyances.","Son orientation sexuelle.","Son état de santé.","La preuve de son autorisation de travail."],"a":3,"r":"L'employeur a l'obligation de vérifier que vous avez le droit de travailler en France. En revanche, il est interdit de vous questionner sur votre santé : seul le médecin du travail est habilité à valider votre aptitude physique."},{"t":"République","q":"Déclarer ses revenus aux services fiscaux est :","o":["Facultatif depuis la mise en œuvre du prélèvement à la source","Une obligation pour tous les foyers fiscaux résidant en France","Uniquement nécessaire si l'on est imposable","Une démarche réservée aux seuls salariés du secteur privé"],"a":1,"r":"En France, la déclaration annuelle des revenus reste obligatoire pour tous, même avec le prélèvement à la source, afin d'établir le montant définitif de l'impôt et de calculer le revenu fiscal de référence nécessaire à de nombreuses prestations sociales."},{"t":"République","q":"En France, les impôts permettent de financer les dépenses publiques. Quelle proposition est correcte ?","o":["Les impôts sont facultatifs pour les résidents de nationalité étrangère.","Les impôts permettent de financer les services publics comme l'éducation et la santé.","Chaque contribuable peut choisir l'affectation précise de ses impôts.","Les impôts sont épargnés sur un compte individuel récupérable à la retraite."],"a":1,"r":"Les impôts, basés sur le principe de la solidarité nationale, financent une très large gamme de services publics essentiels tels que l'éducation, la santé, la justice, la défense, ou encore les infrastructures et les aides sociales."},{"t":"République","q":"La liberté d'association est :","o":["Réservée aux citoyens français uniquement.","Soumise à une autorisation du Préfet.","Un droit fondamental.","Limitée aux syndicats et partis politiques."],"a":2,"r":"La liberté d'association est un principe constitutionnel régi par la loi de 1901. C'est un régime déclaratif : on déclare l'association pour qu'elle existe juridiquement, mais on n'a pas besoin de demander l'autorisation à l'État pour la créer."},{"t":"République","q":"La liberté d'expression sur les réseaux sociaux en France est :","o":["Absolue et illimitée","Soumise à une censure préalable","Libre dans le respect de la loi","Interdite"],"a":2,"r":"Inscrite dans la Déclaration des Droits de l'Homme et du Citoyen, cette liberté n'est pas absolue : elle est encadrée par la loi pour sanctionner les abus (incitation à la haine, diffamation)."},{"t":"République","q":"Lequel de ces prénoms évoque un symbole de la République ?","o":["Jeanne d'Arc","Marie-Antoinette","Marianne","Joséphine"],"a":2,"r":"Marianne est l'allégorie de la République et de ses valeurs (liberté, égalité, fraternité). Elle figure notamment dans les mairies et sur les timbres."},{"t":"République","q":"Lequel de ces symboles représente la République française ?","o":["Les fleurs de lys","La couronne impériale","Le drapeau tricolore","Le drapeau européen"],"a":2,"r":"Le drapeau tricolore (bleu, blanc, rouge) est l'unique emblème national de la France, tel que défini par l'article 2 de la Constitution de la Ve République."},{"t":"République","q":"Où peut-on voir la devise de la République ?","o":["Uniquement sur les mairies.","Sur les pièces de monnaie et les bâtiments publics.","Écrite sur la bande blanche du drapeau français.","Sur les billets de banque en euros."],"a":1,"r":"La devise 'Liberté, Égalité, Fraternité' se trouve sur les édifices publics (mairies, écoles, tribunaux), sur les timbres et les pièces de monnaie. Elle ne figure jamais sur le drapeau, ni sur les billets (qui sont européens)."},{"t":"République","q":"Lesquels sont des symboles officiels de la République française ?","o":["Le Palais de l'Élysée et le Code Civil","Le drapeau tricolore, la Marseillaise et Marianne","Le logo du Gouvernement et le bulletin de vote","Le château de Versailles et le Conseil constitutionnel"],"a":1,"r":"Le drapeau, l'hymne national et la devise sont inscrits dans la Constitution. Marianne est l'allégorie symbolique qui complète ces emblèmes officiels dans les lieux de pouvoir républicains."},{"t":"République","q":"Peut-on brûler publiquement un drapeau français ?","o":["Oui, c'est protégé par la liberté d'expression","Non, l'outrage au drapeau est puni par la loi.","Uniquement dans le cadre d'un événement privé.","Oui, si le drapeau vous appartient légalement."],"a":1,"r":"L'outrage public au drapeau tricolore est une infraction. Il est puni de 1 500 € d'amende (contravention), et jusqu'à 7 500 € (délit) lors d'une manifestation officielle."},{"t":"République","q":"Quand la sécurité sociale a-t-elle été établie en France ?","o":["1945","1936","1958","1981"],"a":0,"r":"La Sécurité sociale a été établie en France en 1945, juste après la Seconde Guerre mondiale, dans le but de garantir une protection sociale universelle à tous les citoyens."},{"t":"République","q":"Que commémore la fête nationale ?","o":["L'Armistice de la Première Guerre mondiale.","La prise de la Bastille et la Fête de la Fédération.","La Déclaration des Droits de l'Homme.","La proclamation de la République."],"a":1,"r":"Le 14 juillet est une double fête : il célèbre la prise de la Bastille (14 juillet 1789, fin de la monarchie absolue) et la Fête de la Fédération (14 juillet 1790, symbole de l'union nationale)."},{"t":"République","q":"Que porte Marianne sur la tête ?","o":["Une couronne de fleurs","Un casque militaire","Un bonnet phrygien","Un diadème"],"a":2,"r":"Marianne porte traditionnellement un bonnet phrygien. Ce symbole, hérité des esclaves affranchis dans l'Antiquité, représente la liberté et la rupture avec l'oppression."},{"t":"Principes et valeurs de la République française","q":"Que signifie le mot \"fraternité\" dans la devise française ?","o":["Le respect strict de la loi par tous.","La liberté totale de chaque individu.","La solidarité entre tous les citoyens.","L'égalité parfaite de tous les revenus."],"a":2,"r":"Dans la devise républicaine, la fraternité exprime le lien de solidarité, de tolérance et d'entraide qui doit unir tous les citoyens au sein de la nation."},{"t":"République","q":"Quel symbole de la République peut-on voir sur les maillots de l'équipe de France de football ?","o":["La devise de la République","Le coq gaulois","Une Marianne","Le drapeau européen"],"a":1,"r":"Le coq gaulois est un emblème traditionnel symbolisant la France. S'il n'est pas un symbole officiel mentionné dans la Constitution de 1958, il représente l'identité nationale, notamment dans le domaine sportif et sur certains monuments aux morts."},{"t":"Histoire, géographie et culture","q":"Quelle est la devise de l'Union européenne ?","o":["L'union fait la force.","Unie dans la diversité.","Paix, liberté et justice.","La force par la solidarité."],"a":1,"r":"La devise de l'Union européenne est 'Unie dans la diversité'. Elle souligne que les nations travaillent ensemble pour la paix tout en conservant leurs cultures respectives."},{"t":"République","q":"Quelle est la devise de la République française ?","o":["Ordre et Progrès","Liberté, Égalité, Fraternité","Unité et Solidarité","Paix et Justice"],"a":1,"r":"La devise 'Liberté, Égalité, Fraternité' est inscrite dans l'article 2 de la Constitution de 1958. Elle définit les principes fondamentaux de la vie en société en France."},{"t":"République","q":"Qu'est-ce que la liberté d'association ?","o":["Le droit de créer des entreprises.","Le droit de s'unir pour un projet commun sans chercher à partager de bénéfices.","Le droit de manifester.","Le droit de voter."],"a":1,"r":"Issue de la loi de 1901, la liberté d'association permet à au moins deux personnes de s'unir pour un projet commun (culturel, caritatif, sportif) dans un but autre que de partager des bénéfices."},{"t":"République","q":"Qu'est-ce qu'une liberté ?","o":["Une loi stricte imposée par l'État.","La possibilité de faire tout ce que l'on veut sans aucune restriction.","Le droit de faire tout ce qui ne nuit pas à autrui et qui est garanti par la loi.","Une permission accordée par le gouvernement."],"a":2,"r":"Selon la Déclaration des droits de l'homme et du citoyen de 1789, la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui ; son exercice est encadré par la loi."},{"t":"Principes et valeurs de la République française","q":"Selon la Constitution, la France est une République...","o":["fédérale, religieuse, parlementaire et libérale.","indivisible, laïque, démocratique et sociale.","centralisée, souveraine, pacifique et unitaire.","européenne, unie, participative et égalitaire."],"a":1,"r":"L'article premier de la Constitution de 1958 définit la France comme une République indivisible, laïque, démocratique et sociale. Elle assure l'égalité devant la loi de tous les citoyens."},{"t":"République","q":"Sur quel document peut-on voir Marianne ?","o":["Sur les billets en euros.","Sur la carte électorale ou la carte nationale d'identité.","Sur le drapeau français.","Sur le passeport uniquement."],"a":1,"r":"Marianne est l'allégorie de la République. Son effigie figure notamment sur la carte électorale, la carte d'identité, ainsi que sur les timbres-poste."},{"t":"République","q":"Une des valeurs de la devise républicaine est l'Égalité. Qu'est-ce que cela signifie ?","o":["Que l'État doit verser à tous les citoyens le même revenu mensuel, quel que soit leur travail.","Que tous les citoyens sont égaux devant la loi, quelles que soient leurs origines ou leurs croyances.","Que la loi s'applique différemment selon la situation sociale ou l'origine ethnique des personnes.","Que l'égalité des droits ne s'applique qu'aux personnes de nationalité française de naissance."],"a":1,"r":"L'égalité juridique garantit que la loi est la même pour tous (qu'elle protège ou qu'elle punisse), sans distinction de naissance, de religion ou d'origine, conformément à la Déclaration des Droits de l'Homme et du Citoyen."},{"t":"République","q":"Une personne peut-elle changer librement de religion en France ?","o":["Non, cela nécessite une déclaration préalable en préfecture.","Oui, la France garantit la liberté de conscience et de culte.","Seulement si la nouvelle religion est reconnue par l'État.","Non, le changement de religion n'est pas reconnu par le droit civil."],"a":1,"r":"La liberté de conscience, inscrite dans la Déclaration des Droits de l'Homme et du Citoyen et confirmée par la loi de 1905, inclut le droit de choisir, de pratiquer ou de changer de religion, ou de n'en avoir aucune."},{"t":"Principes et valeurs de la République française","q":"Selon le principe de laïcité, que signifie la neutralité de l'Etat ?","o":["L'État interdit toute expression ou pratique religieuse dans l'espace public pour l'ensemble des citoyens.","L'État nomme et rémunère les dirigeants des principaux cultes de France.","L'État autorise et soutient financièrement uniquement les cultes historiques.","L'État ne finance et ne favorise aucune religion."],"a":3,"r":"La laïcité sépare les Églises et l'État. La neutralité signifie que l'État n'intervient pas dans l'organisation des cultes, n'en subventionne aucun (loi de 1905) et les traite tous équitablement, garantissant ainsi la liberté de conscience."},{"t":"Institutions","q":"Que peut faire un usager du service public dans une mairie ?","o":["Faire une demande de titre de séjour ou de renouvellement de visa.","Déclarer ses impôts sur le revenu.","Obtenir un acte de naissance ou déposer une demande de passeport.","Demander un extrait de casier judiciaire."],"a":2,"r":"La mairie gère l'état civil (naissances, mariages) et les titres d'identité. Attention : les titres de séjour relèvent de la Préfecture, les impôts du centre des finances publiques, et le casier judiciaire du Ministère de la Justice."},{"t":"République","q":"En France, il est possible pour l'État de financer :","o":["La construction de nouveaux édifices religieux.","Les services publics tels que l'éducation nationale et la santé.","Les activités culturelles des grandes religions.","Les salaires des ministres du culte (prêtres, imams, rabbins)."],"a":1,"r":"Selon la loi de 1905, la République ne salarie ni ne subventionne aucun culte. Elle finance en revanche les services publics (écoles, hôpitaux)."},{"t":"République","q":"En quelle année la loi de séparation des Églises et de l'État a-t-elle été votée ?","o":["1945","1905","1958","1889"],"a":1,"r":"La loi de séparation des Églises et de l'État a été votée en 1905."},{"t":"République","q":"Que dit la loi de 1905 ?","o":["Elle impose le financement des édifices religieux par l'impôt national.","Elle garantit la liberté de culte et la neutralité de l'État vis-à-vis des religions.","Elle dispose que la religion catholique est la religion de la majorité des Français.","Elle interdit la pratique religieuse dans l'espace privé."],"a":1,"r":"La loi du 9 décembre 1905 instaure la laïcité en séparant les sphères religieuses et politiques, garantissant à chacun la liberté d'exercer son culte sous réserve du respect de l'ordre public."},{"t":"République","q":"Que garantit le principe de laïcité ?","o":["La primauté d'une religion.","La neutralité de l'État en matière de religion et la liberté de conscience.","L'interdiction de pratiquer toute religion.","Le financement de toutes les religions par l'État."],"a":1,"r":"La laïcité assure la liberté de croire ou de ne pas croire, et la neutralité de l'État."},{"t":"République","q":"Quel jour célèbre-t-on officiellement la laïcité en France ?","o":["Le 14 juillet","Le 11 novembre","Le 9 décembre","Le 1er janvier"],"a":2,"r":"La Journée nationale de la laïcité est célébrée le 9 décembre, date anniversaire de la loi de 1905 de séparation des Églises et de l'État."},{"t":"République","q":"Quel symbole religieux peut être porté dans une école publique dans le respect de la laïcité ?","o":["Un signe religieux ostensible (très visible).","Aucun, le port de tout signe religieux est strictement interdit.","Un signe religieux discret (uniquement par les élèves).","Un signe religieux couvrant le visage."],"a":2,"r":"La loi du 15 mars 2004 interdit aux élèves le port de signes 'ostensibles' (visibles) dans les écoles publiques, mais autorise les signes discrets (ex: petite médaille). En revanche, les enseignants et personnels (agents publics) ont l'interdiction absolue de porter tout signe religieux, même discret, au nom de la neutralité du service public."},{"t":"République","q":"Quel terme désigne précisément la haine ou les préjugés contre les Juifs ?","o":["Xénophobie","Racisme","Antisémitisme","Islamophobie"],"a":2,"r":"L'antisémitisme est la haine ou les préjugés dirigés contre les Juifs."},{"t":"République","q":"Quel texte est considéré comme le texte fondateur de la laïcité ?","o":["La Déclaration des Droits de l'Homme et du Citoyen de 1789","La Constitution française de 1958","La loi de 1905 de séparation des Églises et de l'État","Le Concordat de 1801"],"a":2,"r":"La loi de 1905 est le texte fondamental qui a instauré la séparation entre l'Église et l'État en France."},{"t":"République","q":"Quelle institution française doit rester neutre en matière de religion ?","o":["Les partis politiques","L'État","Les syndicats","Les associations culturelles"],"a":1,"r":"L'État français, dans sa mission de service public, doit être neutre en matière de religion."},{"t":"République","q":"Qu'est-ce que la laïcité ?","o":["Un régime de tolérance envers toutes les religions.","La séparation de l'État et des religions, garantissant la liberté de conscience.","La liberté de ne pas croire en Dieu, uniquement.","L'obligation pour tous les citoyens d'être neutres en matière religieuse."],"a":1,"r":"La laïcité est le principe qui assure la neutralité de l'État vis-à-vis des religions et garantit la liberté de conscience."},{"t":"République","q":"À l'école, la charte de la laïcité permet de :","o":["Interdire le port de tout signe religieux par les parents d'élèves.","Rappeler les principes de neutralité et de respect mutuel au sein de l'établissement.","Organiser des cours de catéchisme pour toutes les confessions.","Dispenser certains élèves de suivre les enseignements obligatoires."],"a":1,"r":"La Charte de la laïcité est un texte pédagogique qui explicite les principes républicains et les règles de vie commune à l'école."},{"t":"République","q":"Qui doit respecter et veiller à la neutralité religieuse dans les services publics ?","o":["Uniquement les employés de mairie.","Les agents publics.","Les citoyens utilisateurs du service.","Les représentants religieux."],"a":1,"r":"Les agents publics sont tenus de respecter et de faire respecter la neutralité religieuse dans l'exercice de leurs fonctions."},{"t":"République","q":"Une personne déclare ne croire en aucun dieu. On peut dire :","o":["Elle est laïque.","Elle est athée.","Elle est agnostique.","Elle est antireligieuse."],"a":1,"r":"Une personne qui ne croit en aucun dieu est athée. La laïcité, quant à elle, désigne la neutralité de l'État et n'empêche pas de croire ou de ne pas croire."},{"t":"Système institutionnel et politique","q":"Comment est désigné le Premier ministre ?","o":["Par élection directe par les citoyens.","Par le Président de la République.","Par le Parlement.","Par cooptation parmi les ministres."],"a":1,"r":"Le Premier ministre est nommé par le Président de la République."},{"t":"Système institutionnel et politique","q":"Qui peut se présenter aux élections présidentielles ?","o":["Les citoyens français âgés d'au moins 25 ans.","Les citoyens français majeurs remplissant certaines conditions.","Les personnes nées en France.","Les citoyens français ayant exercé un mandat électoral national."],"a":1,"r":"Pour être candidat à l'élection présidentielle, il faut être citoyen français, majeur, inscrit sur les listes électorales, ne pas être frappé d'inéligibilité et obtenir un certain nombre de parrainages d'élus."},{"t":"Système institutionnel et politique","q":"À qui appartient la souveraineté nationale ?","o":["Au Président de la République.","Au Gouvernement.","Au peuple.","Aux députés."],"a":2,"r":"La souveraineté nationale appartient au peuple, qui l'exerce par ses représentants et par la voie du référendum."},{"t":"Système institutionnel et politique","q":"Qui est élu lors des élections municipales ?","o":["Les maires.","Les conseillers municipaux.","Les conseillers départementaux.","Les conseillers régionaux."],"a":1,"r":"Les citoyens élisent les conseillers municipaux au suffrage universel direct. Ce sont ensuite ces conseillers qui élisent le maire lors de la première séance du conseil municipal."},{"t":"Système institutionnel et politique","q":"L'inscription sur les listes électorales est :","o":["Obligatoire.","Facultative.","Automatique lors de tout déménagement.","Conditionnée au paiement d'impôts locaux."],"a":0,"r":"En France, l'inscription sur les listes électorales est obligatoire pour tous les citoyens en âge de voter, même si la loi ne prévoit pas de sanction financière en cas de non-inscription."},{"t":"Système institutionnel et politique","q":"Quelle condition est nécessaire pour voter aux élections présidentielles ?","o":["Être citoyen d'un pays de l'Union européenne résidant en France.","Être de nationalité française et inscrit sur les listes électorales.","Payer des impôts en France depuis au moins 3 ans.","Être propriétaire de son logement principal."],"a":1,"r":"Seuls les citoyens français majeurs peuvent voter à la présidentielle. Les citoyens européens ne peuvent voter qu'aux élections municipales et européennes."},{"t":"Système institutionnel et politique","q":"Quelle condition faut-il remplir pour être candidat aux élections municipales ?","o":["Être majeur, français ou citoyen européen, et avoir un lien avec la commune (y résider ou y payer des impôts).","Être majeur, exclusivement de nationalité française, et résider dans la commune.","Être majeur, inscrit sur les listes électorales, et posséder un bien immobilier.","Être majeur, de nationalité française, et titulaire d'un diplôme universitaire."],"a":0,"r":"Pour être candidat aux élections municipales, il faut être majeur, de nationalité française ou citoyen d'un pays membre de l'Union européenne, jouir de ses droits civiques et avoir une attache avec la commune (y être inscrit comme électeur ou y payer des impôts locaux)."},{"t":"Système institutionnel et politique","q":"Parmi ces autorités, laquelle est élue ?","o":["Le Préfet","Le Premier ministre","Le Maire","Le Président de la Cour de Cassation"],"a":2,"r":"Le maire est élu par les membres du conseil municipal (suffrage indirect), eux-mêmes élus par les citoyens. Les autres fonctions citées (préfet, Premier ministre, magistrat) sont nommées."},{"t":"Système institutionnel et politique","q":"Quelles sont les fonctions du maire ?","o":["Représenter la commune, exécuter les décisions du conseil municipal et veiller à l'ordre public.","Voter des lois locales, rendre la justice pénale et diriger la police nationale.","Représenter le département, gérer l'entretien des lycées et nommer les magistrats.","Lever les impôts nationaux, présider le tribunal d'instance et commander la gendarmerie."],"a":0,"r":"Le maire est à la fois le représentant de la commune, l'exécutif des décisions du conseil municipal et l'autorité chargée de la police administrative dans sa commune pour maintenir l'ordre public."},{"t":"Système institutionnel et politique","q":"Une personne, n'ayant pas d'accès à internet, veut s'inscrire sur les listes électorales pour pouvoir voter aux prochaines élections politiques. Où peut-elle s'inscrire ?","o":["En se rendant à la mairie de son domicile (ou par courrier).","Au commissariat de police ou à la gendarmerie.","À la préfecture de son département.","Auprès du tribunal judiciaire."],"a":0,"r":"Sans internet, l'inscription se fait soit au guichet de la mairie, soit par courrier postal. Le commissariat sert à faire une procuration, pas à s'inscrire."},{"t":"Droits et devoirs","q":"À quel âge peut-on devenir électeur ?","o":["À partir de 16 ans.","À partir de 18 ans.","À partir de 21 ans.","À partir de 25 ans."],"a":1,"r":"En France, le droit de vote s'acquiert à la majorité légale, c'est-à-dire à 18 ans, à condition d'être inscrit sur les listes électorales."},{"t":"Système institutionnel et politique","q":"En France, est-ce obligatoire de voter ?","o":["Oui, le vote est obligatoire sous peine d'amende.","Non, le vote est un droit, pas une obligation.","Seulement pour les fonctionnaires.","Uniquement lors des élections présidentielles."],"a":1,"r":"En France, le vote est un droit et un devoir civique (moral), mais il n'est pas légalement obligatoire pour les citoyens."},{"t":"Système institutionnel et politique","q":"A-t-on le droit de ne pas respecter une loi ?","o":["Oui, si la loi est injuste.","Non, chacun est tenu de respecter la loi.","Uniquement en cas de désobéissance civile pacifique.","Si la majorité des citoyens est contre."],"a":1,"r":"Chacun est tenu de respecter la loi. Le non-respect des lois peut entraîner des sanctions."},{"t":"Système institutionnel et politique","q":"Comment sont désignés les députés ?","o":["Ils sont nommés directement par le Président de la République.","Ils sont élus par les citoyens lors des élections législatives.","Ils sont élus au suffrage indirect par un collège de grands électeurs.","Ils sont choisis par le Premier ministre et le gouvernement."],"a":1,"r":"Les députés sont élus par les citoyens au suffrage universel direct lors des élections législatives, tandis que les sénateurs sont élus au suffrage indirect."},{"t":"Système institutionnel et politique","q":"Qui vote les lois ?","o":["Le Président de la République.","Le Gouvernement.","Le Parlement (composé de l'Assemblée nationale et du Sénat).","Les citoyens par référendum uniquement."],"a":2,"r":"En France, le pouvoir législatif est exercé par le Parlement (l'Assemblée nationale et le Sénat), qui débat et vote les lois."},{"t":"Système institutionnel et politique","q":"La séparation des pouvoirs est un principe fondamental. Quels sont les trois pouvoirs concernés ?","o":["Le pouvoir exécutif, le pouvoir législatif et le pouvoir judiciaire.","Le pouvoir présidentiel, le pouvoir ministériel et le pouvoir parlementaire.","Le pouvoir central, le pouvoir régional et le pouvoir local.","Le pouvoir de l'armée, le pouvoir de la police et le pouvoir de la justice."],"a":0,"r":"La séparation des pouvoirs concerne le pouvoir exécutif, le pouvoir législatif et le pouvoir judiciaire."},{"t":"Système institutionnel et politique","q":"Qu'est-ce que l'État de droit ?","o":["Un régime où le Chef de l'État est au-dessus des règles.","Un système où tout le monde, y compris l'État, doit respecter la loi.","Un pays où la police a tous les pouvoirs pour maintenir l'ordre.","Une situation où les juges décident de la politique du pays."],"a":1,"r":"Dans un État de droit, personne n'est au-dessus des lois, pas même le Président ou le gouvernement. Cela protège les citoyens contre l'arbitraire (le pouvoir absolu)."},{"t":"Système institutionnel et politique","q":"Quelles sont les durées du mandat du conseil municipal et du maire ?","o":["Conseil municipal : 4 ans, Maire : 5 ans.","Conseil municipal : 6 ans, Maire : 6 ans.","Conseil municipal : 6 ans, Maire : 5 ans.","Conseil municipal : 5 ans, Maire : 6 ans."],"a":1,"r":"En France, les conseillers municipaux sont élus pour un mandat de 6 ans. Le maire, élu par ces conseillers, l'est également pour la même durée."},{"t":"Système institutionnel et politique","q":"Qui est élu lors des élections législatives ?","o":["Les conseillers municipaux","Les sénateurs","Les députés","Le Président de la République"],"a":2,"r":"Les élections législatives permettent d'élire les députés. Ils siègent à l'Assemblée nationale, où ils votent les lois et contrôlent l'action du gouvernement."},{"t":"Système institutionnel et politique","q":"Quelle est la durée du mandat du Président de la République française ?","o":["7 ans","5 ans","4 ans","6 ans"],"a":1,"r":"Le mandat du Président de la République française est de 5 ans (quinquennat) depuis la révision constitutionnelle de 2000, entrée en vigueur en 2002. Auparavant, il était de 7 ans (septennat)."},{"t":"Système institutionnel et politique","q":"Quelle est la durée du mandat des députés ?","o":["7 ans","6 ans","4 ans","5 ans"],"a":3,"r":"Les députés sont élus pour un mandat de 5 ans, appelé une législature (sauf en cas de dissolution de l'Assemblée nationale par le Président)."},{"t":"Système institutionnel et politique","q":"Quelle est la durée du mandat des sénateurs ?","o":["5 ans","7 ans","6 ans","4 ans"],"a":2,"r":"Le mandat des sénateurs est de 6 ans."},{"t":"Système institutionnel et politique","q":"Qui dirige l'action du gouvernement ?","o":["Le Président de la République","Le Premier ministre","Le Ministre de l'Intérieur","Le Président de l'Assemblée Nationale"],"a":1,"r":"Le Premier ministre dirige l'action du gouvernement et est responsable devant le Parlement."},{"t":"Système institutionnel et politique","q":"En France, est-ce possible d'adhérer à un parti politique ?","o":["Non, l'adhésion est réservée aux seuls agents de la fonction publique.","Oui, c'est un droit fondamental lié à la liberté d'association.","Oui, mais cela nécessite une autorisation préalable du ministère de l'Intérieur.","Non, les partis politiques n'ont pas d'existence légale en France."],"a":1,"r":"L'adhésion à un parti est un droit fondamental découlant de la liberté d'association et de l'article 4 de la Constitution."},{"t":"Système institutionnel et politique","q":"Qui sanctionne l'auteur d'un vol ?","o":["Le procureur de la République","L'officier de police judiciaire","Le juge","Le ministre de la Justice"],"a":2,"r":"Seul le juge a le pouvoir de prononcer une peine (sanction). La police mène l'enquête et le procureur décide s'il faut poursuivre l'auteur devant le tribunal."},{"t":"Système institutionnel et politique","q":"Qui gère les collèges publics ?","o":["La commune","Le département","La région","L'État"],"a":1,"r":"Le département gère les collèges publics. Pour rappel, la commune gère les écoles primaires et maternelles, tandis que la région gère les lycées."},{"t":"Système institutionnel et politique","q":"Qui gère les écoles primaires et maternelles publiques ?","o":["La commune","Le département","La région","L'État"],"a":0,"r":"La commune possède et gère matériellement les écoles maternelles et primaires publiques (locaux, restauration, agents), tandis que l'État rémunère les enseignants."},{"t":"Système institutionnel et politique","q":"Comment sont désignés les maires ?","o":["Par le préfet.","Par le conseil départemental.","Par le conseil municipal.","Par vote direct des habitants."],"a":2,"r":"Le maire est élu par les membres du conseil municipal (les conseillers municipaux) parmi eux."},{"t":"Système institutionnel et politique","q":"Quelle collectivité territoriale est responsable des transports régionaux ?","o":["La commune","Le département","La région","L'État"],"a":2,"r":"La région est responsable de l'organisation des transports régionaux (trains, bus)."},{"t":"Système institutionnel et politique","q":"Quelle est l'une des voies possibles pour modifier la Constitution ?","o":["Une loi ordinaire du Parlement.","Un vote de l'Assemblée Nationale uniquement.","Un référendum.","Une décision du Conseil constitutionnel."],"a":2,"r":"La Constitution peut être modifiée par voie de référendum (après vote par les deux assemblées), ou par un vote au Congrès (réunion de l'Assemblée Nationale et du Sénat)."},{"t":"Système institutionnel et politique","q":"Qui assure l'intérim du président de la République en cas de décès ?","o":["Le Premier ministre.","Le Président du Sénat.","Le Président de l'Assemblée Nationale.","Le Ministre de la Justice."],"a":1,"r":"Selon l'article 7 de la Constitution, en cas de vacance de la Présidence (décès, démission ou empêchement), l'intérim est provisoirement assuré par le Président du Sénat."},{"t":"Institutions","q":"Quel est le rôle du Conseil constitutionnel ?","o":["Conseiller le Gouvernement sur la rédaction des lois.","Vérifier que les lois respectent la Constitution.","Juger les conflits entre particuliers en dernier recours.","Voter le budget de l'État."],"a":1,"r":"Le Conseil constitutionnel vérifie la conformité des lois avec la Constitution avant leur promulgation. Il veille aussi à la régularité des élections nationales (présidentielles, législatives)."},{"t":"Système institutionnel et politique","q":"Quelle condition est obligatoire pour se présenter à l'élection présidentielle ?","o":["Être de nationalité française, être majeur et jouir de ses droits civiques.","Être de nationalité française de naissance et n'avoir aucune double nationalité.","Être de nationalité française, être majeur et avoir plus de quarante ans.","Être de nationalité française, être majeur et payer des impôts en France."],"a":0,"r":"Pour être candidat à l'élection présidentielle, il faut être de nationalité française, être majeur, et jouir de ses droits civiques. D'autres conditions, comme l'obtention de 500 parrainages d'élus, sont également nécessaires."},{"t":"Système institutionnel et politique","q":"Combien y a-t-il de départements en France ?","o":["90","101","83","96"],"a":1,"r":"La France compte 101 départements : 96 départements en métropole et 5 départements d'outre-mer (la Guadeloupe, la Martinique, la Guyane, La Réunion et Mayotte)."},{"t":"Système institutionnel et politique","q":"Comment est organisé le découpage administratif de la France ?","o":["Régions, départements, communes.","Provinces, arrondissements, cantons.","Départements, régions, préfectures.","Grandes villes, petites villes, villages."],"a":0,"r":"L'organisation administrative de la France repose sur trois principaux échelons de collectivités territoriales : la commune, le département et la région."},{"t":"Système institutionnel et politique","q":"Qui représente l'État dans un département ?","o":["Le maire","Le préfet","Le président du conseil départemental","Le député"],"a":1,"r":"Le préfet est nommé par le président de la République. Il représente l'État et le Gouvernement dans le département, où il est notamment responsable de la sécurité et de l'ordre public."},{"t":"Système institutionnel et politique","q":"Quel est le rôle du Président de la République ?","o":["Diriger l'action du gouvernement au quotidien.","Être le Chef de l'État, garant de la Constitution et des institutions.","Voter les lois à la place du Parlement.","Nommer les députés et les sénateurs."],"a":1,"r":"Le Président veille au respect de la Constitution et assure le fonctionnement régulier des pouvoirs publics. Il nomme le Premier ministre, mais ne dirige pas le gouvernement (rôle du Premier ministre) et ne vote pas les lois (rôle du Parlement)."},{"t":"Système institutionnel et politique","q":"Quel est le rôle du Premier ministre ?","o":["Représenter la France à l'étranger.","Diriger l'action du gouvernement et assurer l'exécution des lois.","Contrôler la conformité des lois à la Constitution.","Promulguer les lois votées par le Parlement."],"a":1,"r":"Le Premier ministre dirige le gouvernement (art. 21). Attention aux confusions : c'est le Président qui promulgue les lois et représente l'État, et le Conseil constitutionnel qui vérifie la conformité des lois."},{"t":"Système institutionnel et politique","q":"Quel est le rôle du Défenseur des droits ?","o":["Défendre les intérêts de l'État face aux citoyens.","Veiller au respect des droits et libertés et lutter contre les discriminations.","Juger les conflits du travail (licenciements, salaires).","Défendre les consommateurs contre les entreprises."],"a":1,"r":"C'est une autorité indépendante qui défend les citoyens face à l'administration et lutte contre les discriminations. Attention : il ne s'occupe pas des litiges privés (consommation, travail) s'il n'y a pas de discrimination, et ce n'est pas un juge."},{"t":"Union européenne","q":"En quelle année la citoyenneté européenne a-t-elle été créée ?","o":["1957 (Traité de Rome)","1992 (Traité de Maastricht)","2002 (Passage à l'Euro)","1979 (Première élection du Parlement)"],"a":1,"r":"La citoyenneté européenne a été instituée par le Traité de Maastricht signé en 1992. Elle complète la citoyenneté nationale sans la remplacer."},{"t":"Histoire, géographie et culture","q":"Quel est le dernier Etat à avoir intégré l'Union Européenne en 2013 ?","o":["La Bulgarie.","La Roumanie.","La Croatie.","La Slovénie."],"a":2,"r":"La Croatie est le dernier pays à avoir rejoint l'Union européenne, le 1er juillet 2013 (elle était alors le 28e État membre). Depuis le départ du Royaume-Uni en 2020 (Brexit), l'Union compte aujourd'hui 27 États membres."},{"t":"Système institutionnel et politique","q":"Qui a composé l'hymne de l'Union européenne ?","o":["Ludwig van Beethoven","Wolfgang Amadeus Mozart","Johann Sebastian Bach","Frédéric Chopin"],"a":0,"r":"L'hymne européen est basé sur l'Ode à la Joie de Ludwig van Beethoven."},{"t":"Système institutionnel et politique","q":"Quand est célébrée la journée de l'Europe ?","o":["Le 14 juillet","Le 9 mai","Le 1er mai","Le 11 novembre"],"a":1,"r":"La journée de l'Europe est célébrée le 9 mai, en commémoration de la déclaration de Robert Schuman de 1950, acte fondateur de l'intégration européenne."},{"t":"Système institutionnel et politique","q":"Où est le siège de la Banque centrale européenne ?","o":["Paris","Berlin","Francfort","Bruxelles"],"a":2,"r":"Le siège de la Banque Centrale Européenne est à Francfort, en Allemagne."},{"t":"Système institutionnel et politique","q":"Où est le siège de la Commission européenne ?","o":["Strasbourg","Luxembourg","Bruxelles","Amsterdam"],"a":2,"r":"Le siège de la Commission européenne est à Bruxelles, en Belgique."},{"t":"Système institutionnel et politique","q":"Qui siège au Parlement européen ?","o":["Des représentants des gouvernements nationaux.","Des eurodéputés élus par les citoyens des États membres.","Des juges nommés.","Des experts économiques."],"a":1,"r":"Le Parlement européen est composé de députés élus par les citoyens des pays membres de l'Union européenne."},{"t":"Système institutionnel et politique","q":"Les citoyens de l'Union européenne peuvent-ils voter aux élections locales dans un autre Etat de l'Union ?","o":["Oui, à toutes les élections politiques de ce pays.","Oui, s'ils y résident et sont inscrits sur les listes électorales.","Non, le droit de vote y est strictement réservé aux citoyens nationaux.","Non, sauf s'ils y possèdent des biens immobiliers."],"a":1,"r":"Un citoyen européen résidant dans un autre État membre a le droit de voter et de se présenter aux élections municipales (locales) et européennes, mais pas aux élections nationales."},{"t":"Système institutionnel et politique","q":"Combien d'États font partie de l'Union européenne actuellement ?","o":["27","28","26","29"],"a":0,"r":"L'UE compte 27 pays membres. Le nombre est passé de 28 à 27 suite au départ du Royaume-Uni (Brexit). Attention à ne pas confondre avec la zone Euro (20 pays) ou les étoiles du drapeau (12)."},{"t":"Système institutionnel et politique","q":"En quelle année le traité de Maastricht, qui marque la fondation de l'Union européenne, a-t-il été signé ?","o":["1986","1992","1997","2001"],"a":1,"r":"Le traité de Maastricht a été signé en 1992, marquant une étape clé dans la construction européenne."},{"t":"Système institutionnel et politique","q":"Quel traité concerne la construction de l'Union européenne ?","o":["Le traité de Versailles (1919).","Les accords d'Évian (1962).","Le traité de Maastricht (1992).","L'Édit de Nantes (1598)."],"a":2,"r":"Il s'agit du traité de Maastricht (1992). Alors que les autres options concernent la fin de conflits (Versailles, Évian) ou la tolérance religieuse (Nantes), Maastricht organise l'union politique et économique des États membres."},{"t":"Système institutionnel et politique","q":"Quel État a quitté l'Union Européenne en 2020 ?","o":["La Suisse","Le Royaume-Uni","La Norvège","L'Islande"],"a":1,"r":"Le Royaume-Uni a quitté l'Union Européenne en 2020, suite au Brexit."},{"t":"Système institutionnel et politique","q":"Quel est l'hymne de l'Union Européenne ?","o":["La Marseillaise","Ode à la Joie","Le Chant des Partisans","La Brabançonne"],"a":1,"r":"L'hymne de l'Union Européenne est l'Ode à la Joie, basée sur la Neuvième Symphonie de Beethoven."},{"t":"Système institutionnel et politique","q":"De quoi est composé le drapeau européen ?","o":["De bandes bleues et blanches.","D'étoiles bleues sur fond blanc.","De douze étoiles dorées formant un cercle sur fond bleu.","De trois couleurs nationales."],"a":2,"r":"Le drapeau européen est composé de douze étoiles dorées formant un cercle sur fond bleu."},{"t":"Système institutionnel et politique","q":"Qui élit les députés européens ?","o":["Les gouvernements nationaux.","Les citoyens des États membres.","Le Parlement national.","Le Conseil européen."],"a":1,"r":"Les députés européens sont élus par les citoyens de chaque État membre de l'Union européenne."},{"t":"Système institutionnel et politique","q":"Où est le siège du Parlement européen ?","o":["Bruxelles","Luxembourg","Strasbourg","Francfort"],"a":2,"r":"Le Parlement européen a son siège officiel à Strasbourg, en France."},{"t":"Droits et devoirs","q":"À quoi sert le droit de grève ?","o":["À cesser le travail tout en maintenant son salaire intégral.","À permettre aux salariés de cesser collectivement le travail pour défendre leurs intérêts professionnels.","À contester une décision purement politique du gouvernement sans lien avec l'entreprise.","À permettre à un salarié de refuser individuellement de travailler."],"a":1,"r":"La grève est un arrêt collectif et concerté du travail pour des motifs professionnels. Attention : le salaire est suspendu pendant la grève et la grève purement politique est interdite."},{"t":"Droits et devoirs","q":"Au nom de quoi l'État justifie-t-il la restriction des droits ?","o":["Pour des raisons d'économies budgétaires uniquement.","Pour la sauvegarde de l'ordre public et l'intérêt général.","Pour protéger les intérêts électoraux du parti au pouvoir.","Selon la seule volonté discrétionnaire du Président de la République."],"a":1,"r":"Les libertés fondamentales peuvent être limitées par la loi uniquement si cela est nécessaire pour garantir l'ordre public ou l'intérêt général."},{"t":"Droits et devoirs","q":"Laquelle de ces citations est inscrite dans la Déclaration des Droits de l'Homme et du Citoyen de 1789 ?","o":["Le droit de vote universel.","La liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui.","Le droit à un logement décent.","Le droit de se syndiquer."],"a":1,"r":"La Déclaration des Droits de l'Homme et du Citoyen de 1789 proclame que la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui."},{"t":"Droits et devoirs","q":"L'article 4 de la Déclaration des droits de l'homme et du citoyen affirme que \"la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui\". Qu'est-ce que cela signifie ?","o":["Que chacun peut agir selon sa seule volonté sans aucune restriction.","Que la liberté individuelle s'arrête là où commence celle des autres.","Que la liberté individuelle permet d'ignorer la loi par conviction personnelle.","Que l'État a le droit d'interdire toute initiative individuelle."],"a":1,"r":"La liberté n'est pas absolue : elle est limitée par le respect des droits d'autrui et par la loi, qui garantit l'intérêt général."},{"t":"Droits et devoirs","q":"Que dit l'article 1er de la Constitution française ?","o":["La France est une République libre, égalitaire et fraternelle.","La France est une République indivisible, laïque, démocratique et sociale.","La France est une démocratie parlementaire souveraine.","La France est une République fédérale et décentralisée."],"a":1,"r":"Il ne faut pas confondre l'Article 1er (Indivisible, Laïque, Démocratique, Sociale) avec la Devise de la France (Liberté, Égalité, Fraternité). De plus, la France n'est pas un état fédéral."},{"t":"Droits et devoirs","q":"Que garantit la liberté de la presse ?","o":["Que toute information peut être diffusée, même si elle est fausse.","Que les médias peuvent publier des informations sans censure préalable de l'État.","Que les journalistes bénéficient d'une immunité totale devant la justice.","Que l'État valide les articles avant leur publication."],"a":1,"r":"La liberté de la presse garantit la diffusion d'informations sans contrôle a priori de l'État (loi de 1881). Toutefois, les journalistes restent juridiquement responsables de leurs propos (diffamation, injure)."},{"t":"Droits et devoirs","q":"Que permet la liberté de circulation ?","o":["De voyager dans le monde entier sans pièce d'identité.","De se déplacer et de résider librement sur le territoire national.","De s'installer sur un terrain privé sans l'accord du propriétaire.","De franchir les frontières nationales sans aucun contrôle."],"a":1,"r":"Aussi appelée « liberté d'aller et venir », elle permet de circuler et de s'installer partout en France. Elle est limitée par le respect de la propriété privée et les nécessités de l'ordre public (contrôles d'identité)."},{"t":"Droits et devoirs","q":"Que signifie être citoyen d'un État ?","o":["Résider légalement sur le territoire avec une carte de séjour.","Avoir des droits (notamment de vote) et des devoirs envers cet État.","Être né sur le territoire, même sans avoir la nationalité.","Être soumis aux lois sans pouvoir participer à la vie politique."],"a":1,"r":"La citoyenneté est un lien juridique et politique. Elle ne se limite pas à habiter dans le pays (résidence) ou à y être né. Elle donne des droits politiques (voter, être élu) en échange de devoirs."},{"t":"Droits et devoirs","q":"Que sont les droits fondamentaux ?","o":["Des droits réservés uniquement aux personnes ayant la nationalité française.","Des droits essentiels et inaliénables garantis par la Constitution.","Des libertés absolues qui permettent de tout faire sans limite.","Des règles qui changent à chaque élection présidentielle."],"a":1,"r":"Ce sont les libertés essentielles (expression, sûreté, etc.) protégées au plus haut niveau (Constitution, DDHC). Ils s'appliquent à tous les êtres humains (pas seulement aux Français) et l'État ne peut pas les supprimer."},{"t":"Droits et devoirs","q":"Quel droit protège une personne contre une arrestation arbitraire ?","o":["La présomption d'innocence.","Le droit à la sûreté.","La liberté de circulation.","L'immunité diplomatique."],"a":1,"r":"C'est le droit à la sûreté (Article 2 de la DDHC). Ce terme historique ne signifie pas 'sécurité dans la rue', mais la garantie qu'on ne peut pas être arrêté ou détenu sans motif légal."},{"t":"Histoire et Valeurs","q":"Quel est le texte fondateur établissant les droits et les devoirs de chaque citoyen ?","o":["La Déclaration Universelle des Droits de l'Homme (1948).","La Déclaration des Droits de l'Homme et du Citoyen de 1789.","Le Traité de l'Union Européenne (Maastricht).","Le Code Civil de Napoléon (1804)."],"a":1,"r":"C'est la Déclaration de 1789. Bien que la déclaration de 1948 soit importante, le texte 'fondateur' historique du système français est bien celui de la Révolution. Le Code Civil, lui, organise la vie privée, pas les droits politiques."},{"t":"Droits et devoirs","q":"Quel texte affirme que tous les hommes naissent libres et égaux en droits ?","o":["La Déclaration des Droits de l'Homme et du Citoyen de 1789.","La Constitution de 1958.","Le Code du Travail.","Le Code Napoléon."],"a":0,"r":"Il s'agit de l'article 1er de la Déclaration de 1789. Ce texte a une valeur juridique suprême en France car il fait partie du 'bloc de constitutionnalité' sur lequel s'appuie le Conseil constitutionnel."},{"t":"Droits et devoirs","q":"Quelle situation est une atteinte à la dignité humaine ?","o":["Être licencié par son employeur pour une faute grave.","Recevoir une amende pour non-respect du code de la route.","Être soumis à des conditions de travail ou de vie dégradantes (esclavage moderne).","Se voir refuser un prêt bancaire par un établissement financier."],"a":2,"r":"La dignité humaine est un principe absolu qui interdit de traiter un être humain comme une chose (torture, esclavage, conditions insalubres). Un licenciement ou une amende sont des sanctions légales, pas des atteintes à la dignité."},{"t":"Droits et devoirs","q":"Qu'est-ce que la liberté d'expression ?","o":["Le droit de tout dire, y compris des propos racistes ou haineux.","Le droit de communiquer ses idées et opinions, dans le respect de la loi.","Le droit de diffuser des informations fausses sans aucune vérification.","Le droit d'insulter quelqu'un publiquement s'il nous a énervé."],"a":1,"r":"La liberté d'expression n'est pas absolue. Elle permet de tout dire *sauf* ce qui est interdit par la loi : l'incitation à la haine, la diffamation, l'injure publique ou l'apologie du terrorisme."},{"t":"Droits et devoirs","q":"Suite à une interpellation par la police, il est possible de :","o":["Être jugé et condamné directement par le policier.","Demander à parler à un avocat.","Refuser de donner son identité.","Exiger de rentrer chez soi pour récupérer des affaires."],"a":1,"r":"Dès le placement en garde à vue qui fait suite à l'interpellation, vous avez le droit de demander l'assistance d'un avocat. De plus, seul un juge (autorité judiciaire) dispose du pouvoir de vous condamner, et non les forces de l'ordre."},{"t":"Laïcité et République","q":"Tous les citoyens français ont-ils une religion ?","o":["Oui, il est obligatoire de déclarer une appartenance religieuse ou athée à la mairie.","Non, la religion est un choix individuel (liberté de conscience).","Non, car la République demande aux citoyens d'abandonner leur religion.","Oui, la Constitution impose la tradition catholique."],"a":1,"r":"La France est une République laïque qui garantit la liberté de conscience. L'État ne demande jamais quelle est votre religion (c'est une donnée privée) et ne vous demande pas d'y renoncer, ni d'en avoir une."},{"t":"Droits et devoirs","q":"À quel âge est la majorité numérique en France ?","o":["15 ans","18 ans","13 ans","16 ans"],"a":0,"r":"La majorité numérique est fixée à 15 ans. C'est l'âge à partir duquel un mineur peut consentir seul au traitement de ses données personnelles par les réseaux sociaux. Cela ne change pas la majorité civile qui reste fixée à 18 ans."},{"t":"Droits et devoirs","q":"Dans lequel de ces endroits est-on autorisé à fumer ?","o":["Dans les transports en commun.","Dans les lieux de travail fermés.","Dans un lieu privé.","Dans les hôpitaux."],"a":2,"r":"Il est généralement interdit de fumer dans les lieux publics fermés, y compris les transports et les hôpitaux. Les lieux privés le permettent."},{"t":"Droits et devoirs","q":"En France, la conduite sans permis d'une moto est :","o":["Une simple infraction administrative sans gravité.","Un délit passible d'une peine de prison et d'une forte amende.","Autorisée si l'on est propriétaire du véhicule.","Tolérée pour les trajets de courte distance."],"a":1,"r":"La conduite sans permis est un délit. Elle expose le conducteur à de lourdes sanctions pénales (jusqu'à 1 an de prison et 15 000 € d'amende) et entraîne l'exclusion des garanties d'assurance en cas d'accident."},{"t":"Droits et devoirs","q":"En quoi consiste le devoir de solidarité ?","o":["À s'occuper uniquement de sa propre famille et de ses proches.","À contribuer au bien commun (impôts, cotisations) et à porter secours.","À ne jamais intervenir dans les problèmes des autres.","À utiliser systématiquement toutes les aides sociales disponibles."],"a":1,"r":"La solidarité n'est pas seulement morale, elle est institutionnelle (payer ses impôts pour financer la protection sociale) et juridique (obligation de porter secours à une personne en danger)."},{"t":"Droits et devoirs","q":"Est-ce légal d'être marié à plusieurs personnes en même temps ?","o":["Oui en France, dans certaines religions.","Non, la polygamie est interdite en France.","En France, uniquement si les époux sont d'accord.","En France, uniquement si le mariage a été célébré à l'étranger."],"a":1,"r":"En France, le mariage est monogame, c'est-à-dire qu'il n'est légal d'être marié qu'à une seule personne à la fois. La loi française s'applique, quelles que soient les pratiques religieuses ou les lois d'autres pays."},{"t":"Droits et devoirs","q":"Est-ce obligatoire de déclarer ses impôts chaque année en France ?","o":["Oui, la déclaration reste obligatoire pour tous les résidents fiscaux.","Non, ce n'est plus la peine avec le prélèvement à la source.","Uniquement si on est imposable (si on paye des impôts).","Seulement pour les propriétaires immobiliers."],"a":0,"r":"Oui, c'est obligatoire, même avec le prélèvement à la source. La déclaration permet de faire le bilan de l'année (régularisation), de recevoir des crédits d'impôt et d'obtenir son avis d'imposition, indispensable pour de nombreuses démarches."},{"t":"Droits et devoirs","q":"Est-il obligatoire de porter secours à une personne en danger ?","o":["Non, c'est un choix personnel et moral.","Oui, c'est une obligation légale si cela ne présente pas de risque pour soi.","Seulement pour les médecins et les pompiers.","Uniquement si l'on est responsable de l'accident."],"a":1,"r":"Le Code pénal punit la 'non-assistance à personne en danger'. Tout citoyen doit aider une personne en péril par son action directe ou en contactant les secours, à condition qu'il n'y ait pas de risque pour lui-même ou pour les tiers."},{"t":"Droits et devoirs","q":"Être juré d'assises est :","o":["Une profession rémunérée.","Un devoir civique.","Une option pour les retraités.","Une activité volontaire."],"a":1,"r":"Être juré d'assises est un devoir civique obligatoire pour les citoyens tirés au sort. Sauf motif d'empêchement légitime (santé, âge), s'y soustraire est passible d'une amende."},{"t":"Droits et devoirs","q":"La vente d'alcool en France est interdite aux personnes de moins de :","o":["16 ans","18 ans","21 ans","25 ans"],"a":1,"r":"La vente d'alcool est interdite aux personnes de moins de 18 ans en France."},{"t":"Droits et devoirs","q":"Le non-respect du code de la route est :","o":["Un simple litige civil qui se règle uniquement entre assurances.","Une infraction passible de sanctions administratives ou pénales.","Un délit entraînant systématiquement une peine de prison.","Une faute qui n'est sanctionnée qu'en cas d'accident avec un tiers."],"a":1,"r":"Le non-respect du code de la route constitue une infraction à la loi (contravention ou délit) passible de sanctions par l'État (amendes, retrait de points, suspension du permis), indépendamment de la survenue d'un accident ou de l'intervention des assurances."},{"t":"Droits et devoirs","q":"Lequel de ces crimes ou délits peut entrainer la privation des droits civils et politiques par un juge ?","o":["Un simple excès de vitesse.","Une fraude électorale.","Un tapage nocturne.","Un litige de voisinage."],"a":1,"r":"La privation des droits civils et politiques (comme le droit de vote ou d'éligibilité) peut être prononcée par un juge pour des infractions graves, telles que la fraude électorale. Les simples contraventions (excès de vitesse, tapage nocturne) ou les conflits civils ne permettent pas cette sanction."},{"t":"Droits et devoirs","q":"Pour obtenir une carte d'identité, il faut :","o":["Être de nationalité française.","Avoir obligatoirement 18 ans.","Être né sur le territoire français.","Avoir un passeport valide."],"a":0,"r":"La seule condition obligatoire est d'être français. L'âge ne compte pas (un bébé peut avoir une carte d'identité) et on peut être français en étant né à l'étranger."},{"t":"Principes et valeurs de la République française","q":"Pour quel motif peut-on limiter la liberté d'expression ?","o":["Pour sanctionner un discours de haine.","Pour empêcher la critique de l'État.","Pour censurer une opinion politique.","Pour protéger le pouvoir en place."],"a":0,"r":"La liberté d'expression est fondamentale, mais la loi la limite pour protéger les individus. Les abus comme la diffamation, l'injure ou l'incitation à la haine et au racisme sont punis par la justice."},{"t":"Droits et devoirs","q":"Que doit faire un citoyen s'il est appelé à être juré dans un procès d'assises ?","o":["Il peut refuser s'il ne se sent pas capable de juger.","Il est obligé de siéger, sauf motif grave reconnu valable.","Il doit témoigner à la barre de ce qu'il sait sur l'affaire.","Il peut se faire remplacer par un avocat."],"a":1,"r":"Être juré est une obligation civique. On ne peut pas refuser (sauf dispense pour raison de santé, familiale ou professionnelle grave acceptée par la commission). L'absence injustifiée est punie de 3 750 € d'amende."},{"t":"Droits et devoirs","q":"Quel est l'âge de la majorité civile en France ?","o":["16 ans","21 ans","18 ans","25 ans"],"a":2,"r":"La majorité civile est fixée à 18 ans en France."},{"t":"Droits et devoirs","q":"Quel est l'un des devoirs principaux d'un citoyen français ?","o":["Voter obligatoirement à toutes les élections, sous peine d'amende.","Soutenir inconditionnellement la politique du gouvernement en place.","Obéir uniquement aux lois qui ne sont pas contraires à ses convictions personnelles.","Respecter les lois et participer à la défense nationale si nécessaire."],"a":3,"r":"Le respect de la loi s'impose à tous (on ne choisit pas). La défense nationale (appel sous les drapeaux en cas de guerre) est un devoir constitutionnel. Le vote, lui, est un droit et un devoir moral, mais il n'est pas juridiquement obligatoire."},{"t":"Droits et devoirs","q":"Quelle est l'infraction la plus grave ?","o":["Le délit","La contravention","Le crime","L'incivilité"],"a":2,"r":"Le droit pénal français classe les infractions en trois catégories selon leur gravité : la contravention (la moins grave), le délit (jugé au tribunal correctionnel) et le crime (jugé aux Assises)."},{"t":"Droits et devoirs","q":"Qu'est-ce que la citoyenneté numérique ?","o":["La capacité technique à programmer des logiciels ou à coder.","L'utilisation responsable des outils numériques pour participer à la vie démocratique.","L'obligation légale de posséder un compte sur les réseaux sociaux.","Le fait d'effectuer ses démarches administratives exclusivement sur internet."],"a":1,"r":"Ce n'est pas une compétence technique (savoir coder), mais une attitude : respecter les autres en ligne, vérifier ses sources (éducation aux médias) et utiliser le numérique pour s'engager."},{"t":"Droits et devoirs","q":"Qu'est-ce que le devoir de mémoire ?","o":["La nostalgie du passé et la volonté de revenir aux traditions anciennes.","Une obligation morale de se souvenir des souffrances du passé pour éviter qu'elles ne se reproduisent.","L'obligation légale de connaître par cœur toutes les dates de l'histoire de France.","Un devoir réservé uniquement aux anciens combattants et aux victimes."],"a":1,"r":"Ce n'est pas de la nostalgie ni un simple cours d'histoire. C'est une vigilance citoyenne : se souvenir des drames (guerres, Shoah, esclavage) pour défendre les valeurs démocratiques aujourd'hui."},{"t":"Système institutionnel et politique","q":"Qui peut être appelé à faire partie d'un jury d'assises en France ?","o":["Les citoyens français tirés au sort.","Tous les résidents vivant en France.","Uniquement les juges professionnels.","Les fonctionnaires de la République."],"a":0,"r":"Les jurés d'assises sont des citoyens français (âgés d'au moins 23 ans) qui sont tirés au sort sur les listes électorales pour participer au jugement des crimes les plus graves."},{"t":"Droits et devoirs","q":"Une personne est privée de ses droits civils et politiques pendant 5 ans suite à une condamnation. Parmi ces propositions laquelle est correcte ? Pendant 5 ans,...","o":["elle ne peut plus travailler dans une entreprise privée.","elle ne peut plus voyager librement hors du territoire.","elle ne peut plus voter ni se présenter aux élections.","elle ne peut plus passer le permis de conduire français."],"a":2,"r":"La privation des droits civiques et politiques (souvent prononcée par un juge) entraîne la perte du droit de vote et d'éligibilité, mais n'enlève pas le droit fondamental de travailler ou de circuler."},{"t":"Histoire, géographie et culture","q":"Parmi ces textes, lequel a été adopté sous Napoléon Ier ?","o":["La Déclaration des Droits de l'Homme et du Citoyen.","Le Code civil.","La loi sur l'école gratuite et obligatoire.","Le Code du travail."],"a":1,"r":"Promulgué en 1804 par Napoléon, le Code civil unifie les règles de vie (famille, propriété) pour tous les Français. La Déclaration date de la Révolution (1789) et l'école gratuite de Jules Ferry (1881)."},{"t":"Histoire, géographie et culture","q":"Qui a été président de la Ve République ?","o":["Jules Ferry","Léon Blum","Jean Jaurès","Charles de Gaulle"],"a":3,"r":"C'est Charles de Gaulle (premier président de la Ve République en 1958). Jules Ferry (l'école), Léon Blum (congés payés) et Jean Jaurès sont de grandes figures de la République, mais d'époques antérieures (IIIe République)."},{"t":"Histoire, géographie et culture","q":"Quel est l'objectif des lois scolaires de la IIIe République ?","o":["Rendre l'instruction religieuse obligatoire dans toutes les écoles.","Créer une école publique, gratuite et laïque.","Interdire définitivement l'existence des écoles privées.","Rendre l'enseignement supérieur obligatoire pour tous."],"a":1,"r":"Sous la IIIe République, les lois de 1881 et 1882 de Jules Ferry ont rendu l'enseignement primaire public gratuit, laïque et obligatoire, sans interdire l'enseignement privé ni imposer de religion."},{"t":"Histoire, géographie et culture","q":"Que signifie la date du 14 juillet pour les Français ?","o":["C'est la fête nationale (Prise de la Bastille et Fête de la Fédération).","C'est la commémoration de l'Armistice de la Première Guerre mondiale.","C'est la célébration de la victoire de 1945 sur l'Allemagne nazie.","C'est l'anniversaire de la proclamation de la Ve République."],"a":0,"r":"C'est la fête nationale. Elle commémore la prise de la Bastille (14 juillet 1789, fin de l'absolutisme) et la Fête de la Fédération (14 juillet 1790, union nationale). L'Armistice, c'est le 11 novembre."},{"t":"Système institutionnel et politique","q":"Pourquoi l'année 1958 est importante pour la France ?","o":["Elle marque la fin officielle de la Seconde Guerre.","Elle marque l'abolition totale de la peine de mort.","Elle marque la création de l'Union européenne (UE).","Elle marque la naissance de la Cinquième République."],"a":3,"r":"L'année 1958 est historique car elle correspond à l'adoption par référendum de l'actuelle Constitution française, portée par le général de Gaulle, fondant ainsi la Ve République."},{"t":"Union européenne","q":"Lequel de ces pays est un pays fondateur de l'Union Européenne ?","o":["Le Royaume-Uni","L'Italie","L'Espagne","La Pologne"],"a":1,"r":"L'Italie est l'un des 6 pays fondateurs (traité de Rome, 1957) avec la France, l'Allemagne, la Belgique, les Pays-Bas et le Luxembourg. L'Espagne a rejoint l'UE en 1986 et le Royaume-Uni, membre depuis 1973, l'a quittée en 2020."},{"t":"Histoire, géographie et culture","q":"Simone Veil est une figure importante de l'histoire française. Elle a notamment :","o":["Été la première femme présidente de la République.","Porté la loi autorisant l'avortement en France.","Écrit la Déclaration des droits de la femme en 1791.","Été la première femme Première ministre de la France."],"a":1,"r":"Rescapée de la Shoah et ministre de la Santé, Simone Veil a porté en 1975 la loi dépénalisant l'Interruption Volontaire de Grossesse (IVG). Elle a également été la première présidente du Parlement européen."},{"t":"Histoire, géographie et culture","q":"Dans quelle région est située une partie des plages du débarquement ayant permis d'engager la libération de la France ?","o":["La Bretagne","La Normandie","Les Hauts-de-France","L'Alsace"],"a":1,"r":"Les plages du débarquement du 6 juin 1944 (Omaha Beach, Utah Beach, etc.) se situent en Normandie."},{"t":"Histoire, géographie et culture","q":"Dans quelle ville les rois de France étaient-ils couronnés ?","o":["Paris","Versailles","Reims","Chartres"],"a":2,"r":"Les rois de France étaient traditionnellement couronnés dans la cathédrale de Reims."},{"t":"Histoire, géographie et culture","q":"Quel roi de France a été guillotiné pendant la Révolution française ?","o":["Louis XIV","Louis XV","Louis XVI","Henri IV"],"a":2,"r":"Louis XVI a été guillotiné le 21 janvier 1793."},{"t":"Histoire, géographie et culture","q":"En quelle année a débuté la Révolution française ?","o":["1776","1789","1815","1848"],"a":1,"r":"La Révolution française a débuté en 1789 avec la prise de la Bastille."},{"t":"Histoire, géographie et culture","q":"En quelle année Napoléon Ier est-il devenu empereur ?","o":["1799","1804","1810","1815"],"a":1,"r":"Napoléon Bonaparte a été proclamé Empereur des Français en 1804."},{"t":"Histoire, géographie et culture","q":"Lequel de ces personnages a un lien avec la République française ?","o":["Louis XIV","Jules Ferry","Napoléon Ier","Jeanne d'Arc"],"a":1,"r":"Jules Ferry est une figure emblématique de la IIIe République. Il est l'auteur des lois de 1881-1882 qui ont instauré l'école publique gratuite, laïque et obligatoire en France."},{"t":"Histoire, géographie et culture","q":"De quand date l'appel à la résistance du général de Gaulle ?","o":["18 juin 1940","8 mai 1945","6 juin 1944","11 novembre 1918"],"a":0,"r":"Le général de Gaulle a lancé son appel à la résistance le 18 juin 1940 depuis Londres."},{"t":"Histoire, géographie et culture","q":"Qu'est-ce que la Shoah ?","o":["La famine en Ukraine","Le génocide des Juifs par les Nazis pendant la Seconde Guerre mondiale.","La bataille de Stalingrad.","L'attaque de Pearl Harbor."],"a":1,"r":"La Shoah est le génocide des Juifs d'Europe perpétré par le régime nazi. Cet événement constitue un crime contre l'humanité, dont la mémoire est fondamentale pour la République."},{"t":"Histoire, géographie et culture","q":"Quel pays a été une colonie française ?","o":["Le Portugal","Le Brésil","L'Égypte","Le Sénégal"],"a":3,"r":"Le Sénégal a été une colonie française intégrée à l'Afrique Occidentale Française (AOF) jusqu'à son indépendance en 1960."},{"t":"Histoire, géographie et culture","q":"Qui a rendu l'école gratuite, laïque et obligatoire ?","o":["L'empereur des Français Napoléon Bonaparte.","Le célèbre écrivain et politicien Victor Hugo.","Le ministre de l'Instruction publique Jules Ferry.","Le président de la République Charles de Gaulle."],"a":2,"r":"C'est Jules Ferry, en tant que ministre de l'Instruction publique, qui a fait voter les grandes lois scolaires de 1881 et 1882 établissant l'école gratuite, laïque et obligatoire."},{"t":"Histoire, géographie et culture","q":"Depuis quand les Français élisent-ils le président de la République au suffrage universel direct ?","o":["1958","1962","1944","1981"],"a":1,"r":"C'est depuis le référendum de 1962 (voulu par De Gaulle) que ce mode d'élection est adopté. La première élection a eu lieu ensuite en 1965. Avant cela (en 1958), il était élu par des grands électeurs."},{"t":"Histoire, géographie et culture","q":"En quelle année l'Union européenne a
