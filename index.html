<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Examen civique – préparation naturalisation</title>
<style>
:root{--bg:#f5f5f0;--card:#fff;--ink:#1a1b22;--mute:#646873;--line:#e1e1da;--blue:#000091;--onblue:#fff;--soft:#e9e9fb;--red:#c9191e;--ok:#18753c;--oksoft:#dff3e6;--bad:#b3261e;--badsoft:#fde7e5;--r:14px}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.flag{height:5px;background:linear-gradient(90deg,#000091 0 33.3%,#fff 33.3% 66.6%,#e1000f 66.6%)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar-top{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.01em;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;color:var(--mute);font:inherit;font-size:14px;padding:7px 11px;border-radius:999px;cursor:pointer}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--soft);color:var(--blue);font-weight:600}
main{max-width:900px;margin:0 auto;padding:22px 16px 70px}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:19px;line-height:1.35;margin:0 0 14px}
h3{font-size:16px;margin:18px 0 6px}
p{margin:0 0 10px}
.mute{color:var(--mute)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px}
.hero{display:flex;gap:20px;align-items:center;background:var(--blue);color:var(--onblue);border-radius:var(--r);padding:22px;margin-bottom:16px}
.hero .mute{color:inherit;opacity:.82}
.count{text-align:center;min-width:104px;border-right:1px solid rgba(128,128,128,.45);padding-right:20px}
.count b{display:block;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:14px}
.grid .card{margin:0;display:flex;flex-direction:column;gap:8px}
.grid .card b{line-height:1.3}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.row.spread{justify-content:space-between}
.btn{border:1px solid var(--blue);background:var(--blue);color:var(--onblue);font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:none;color:var(--blue)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.opt:focus-visible,nav button:focus-visible,.dot:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stats div b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stats div span{font-size:13px;color:var(--mute)}
.tag{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin-bottom:8px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:12px 14px;border-radius:11px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--blue);font-weight:700;font-size:13px;display:grid;place-items:center}
.opt.sel{border-color:var(--blue);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:var(--oksoft)}
.opt.bad{border-color:var(--bad);background:var(--badsoft)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:11px;font-size:15px}
.fb.good{background:var(--oksoft)}
.fb.wrong{background:var(--badsoft)}
.prog{display:flex;gap:12px;align-items:center;margin-bottom:12px;font-size:14px;color:var(--mute)}
.prog .bar{flex:1}
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.controls label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
select,input[type=search]{font:inherit;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.examtop{position:sticky;top:58px;z-index:4;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--bg);padding:8px 0;margin-bottom:6px}
.clock{font-size:22px;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dot{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--mute);font:inherit;font-size:13px;cursor:pointer}
.dot.done{background:var(--soft);color:var(--blue);border-color:transparent;font-weight:600}
.dot.cur{border:2px solid var(--blue)}
.big{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pass{color:var(--ok)}.fail{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}
details{border-bottom:1px solid var(--line)}
details summary{cursor:pointer;padding:10px 2px;list-style-position:outside}
details .ans{padding:0 2px 12px 18px}
details .ans b{color:var(--ok)}
.notes details{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:10px;padding:0 18px}
.notes summary{font-weight:700;font-size:17px;padding:14px 0}
.notes ul{margin:0 0 12px;padding-left:20px}
.notes li{margin-bottom:4px}
.pill{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--line)}
.pill.g{background:var(--ok)}.pill.r{background:var(--bad)}
@media (max-width:560px){.hero{flex-direction:column;align-items:flex-start}.count{border:0;padding:0;text-align:left}.examtop{top:96px}h1{font-size:22px}}
</style>
</head>

P:[["Devise et symboles",["Devise : Liberté, Égalité, Fraternité. Elle est inscrite sur le fronton des bâtiments publics.","Drapeau tricolore bleu, blanc, rouge : officiel depuis 1794.","Hymne : la Marseillaise, écrite par Rouget de Lisle en 1792.","Marianne porte un bonnet phrygien (liberté). On la voit sur les documents de l'administration et dans les mairies.","Fête nationale : 14 juillet, depuis 1880. Elle commémore la prise de la Bastille (1789) et la fête de la Fédération (1790).","Langue de la République : le français. Le coq : symbole national sans statut officiel.","Sécurité sociale : créée en 1945. Elle illustre la solidarité et la fraternité."]],
["Les principes (article 1er de la Constitution du 4 octobre 1958)",["La France est une République indivisible, laïque, démocratique et sociale.","Indivisible : mêmes lois, mêmes droits et devoirs partout, en métropole et outre-mer.","Démocratique : la souveraineté appartient au peuple (article 3). Suffrage universel direct ou indirect.","Sociale : l'État favorise l'égalité des chances (école gratuite, logement social, emploi, santé).","La Constitution est au sommet de la hiérarchie des normes."]],
["Laïcité",["Loi du 9 décembre 1905 : séparation des Églises et de l'État. Journée de la laïcité : 9 décembre.","Elle garantit la liberté de conscience (croire, ne pas croire, changer de religion) et le libre exercice des cultes. Elle impose la neutralité de l'État.","L'État ne finance ni lieu de culte ni personnel religieux. Exceptions : Alsace et Moselle ; restauration d'un monument religieux classé.","Agents publics : neutres, pas de signe religieux au travail. Usagers : signes autorisés, mais pas d'adaptation du service au nom d'une religion.","École publique (loi du 15 mars 2004) : signes ostensibles interdits aux élèves, signes discrets autorisés. Charte de la laïcité à l'École.","Entreprises privées : les salariés peuvent exprimer leurs convictions, sauf limites justifiées (sécurité, bon fonctionnement).","Espace public : on peut montrer sa religion. Loi du 11 octobre 2010 : interdiction de dissimuler son visage.","Le blasphème n'est pas un délit. Le prosélytisme est autorisé sans pression, mais interdit dans les services publics.","Athée : ne croit en aucune religion. Agnostique : sceptique vis-à-vis de la religion."]],
["Égalité et discriminations",["Mêmes droits quels que soient le sexe, l'origine, la religion, les opinions, l'orientation sexuelle.","Les discriminations sont punies par la loi : sexisme, racisme, antisémitisme (haine des Juifs), discrimination religieuse, haine anti-LGBT+.","Embauche : seules des raisons professionnelles comptent ; l'employeur peut demander les diplômes."]]],
S:[["Les institutions",["Président de la République : élu au suffrage universel direct pour 5 ans, renouvelable une fois. Chef de l'État et des armées. Il nomme le Premier ministre. Il faut 500 parrainages d'élus pour être candidat.","Premier ministre : dirige l'action du Gouvernement.","Parlement : vote les lois et contrôle le Gouvernement. Assemblée nationale : 577 députés, 5 ans, suffrage direct. Sénat : 348 sénateurs, 6 ans, suffrage indirect.","Trois pouvoirs séparés : législatif, exécutif, judiciaire.","Conseil constitutionnel : conformité des lois à la Constitution, régularité des élections nationales.","En cas de décès du Président : intérim par le président du Sénat.","La Constitution se modifie par référendum ou par le Parlement réuni en Congrès.","État de droit : la loi s'impose à tous, y compris à l'État."]],
["Voter",["Conditions : nationalité française, 18 ans, droits civiques, inscription sur les listes électorales (internet ou mairie).","Les citoyens de l'Union européenne votent aux élections municipales et européennes.","Voter n'est pas obligatoire, mais c'est un devoir civique. Le vote est personnel et secret.","1848 : suffrage universel masculin. 1944 : droit de vote des femmes (premier vote en avril 1945)."]],
["Organisation territoriale",["Communes (34 875) : maire et conseil municipal élus pour 6 ans. Écoles primaires, état civil, routes communales.","Départements : 101 (96 en métropole, 5 outre-mer). Collèges, action sociale. Mayotte est le 101e depuis 2011.","Régions : 13 en métropole + 5 outre-mer = 18. Lycées, transports, développement économique.","Le préfet représente l'État dans le département et la région.","Outre-mer : 12 territoires. Départements-régions : Guadeloupe, Martinique, Guyane, La Réunion, Mayotte.","Antilles françaises : Martinique, Guadeloupe, Saint-Martin, Saint-Barthélemy."]],
["Union européenne",["1951 : CECA. 1957 : traité de Rome (CEE), six pays fondateurs : France, Allemagne, Italie, Belgique, Pays-Bas, Luxembourg.","1992 : traité de Maastricht. Création de l'Union européenne et de la citoyenneté européenne.","2002 : pièces et billets en euros. 2013 : entrée de la Croatie. 2020 : départ du Royaume-Uni. Aujourd'hui : 27 États.","Sièges : Parlement à Strasbourg, Commission à Bruxelles, Banque centrale à Francfort.","Députés européens élus tous les 5 ans par les citoyens.","Hymne : l'Ode à la joie (Beethoven). Devise : Unie dans la diversité. Drapeau : 12 étoiles. Journée de l'Europe : 9 mai."]]],
D:[["Les grands textes",["Déclaration des droits de l'homme et du citoyen du 26 août 1789. Article 1er : les hommes naissent et demeurent libres et égaux en droits. Article 4 : la liberté consiste à pouvoir faire tout ce qui ne nuit pas à autrui.","Autres textes : Constitution de 1958, préambule de 1946, Charte de l'environnement de 2004, Convention européenne des droits de l'homme.","Code civil : promulgué en 1804 par Napoléon Bonaparte."]],
["Libertés et droits",["Liberté d'expression et de la presse : limites = diffamation, injure, incitation à la haine, apologie ou négation de crimes contre l'humanité.","Liberté de circulation en France et dans l'Union européenne.","Vie privée : secret médical, droit à l'image. Dignité : pas d'esclavage ni de travail forcé.","Droit à disposer de son corps : contraception (y compris pour les mineurs), IVG garantie par la Constitution depuis le 8 mars 2024. La GPA est interdite.","Droit à la sûreté : pas d'arrestation arbitraire. En garde à vue : droit au silence, à un avocat, à prévenir un proche.","Justice : présomption d'innocence, aide juridictionnelle, Défenseur des droits (créé en 2011).","Manifester : déclaration préalable obligatoire. Association : loi du 1er juillet 1901."]],
["Devoirs",["Respecter les lois et les institutions. L'outrage au drapeau ou à l'hymne est puni.","Infractions : contravention (tribunal de police), délit (tribunal correctionnel), crime (cour d'assises ou cour criminelle).","Déclarer ses revenus et payer ses impôts (article 13 de la DDHC).","Être juré d'assises si l'on est appelé. Participer à la défense : recensement à 16 ans, Journée Défense et Citoyenneté.","Porter secours : la non-assistance à personne en danger est un délit.","Scolariser ses enfants de 3 à 16 ans.","Majorité civile : 18 ans (depuis 1974). Majorité numérique : 15 ans (loi du 7 juillet 2023).","Alcool : vente interdite aux moins de 18 ans. Tabac : interdit dans les lieux fermés et, depuis le 1er juillet 2025, dans les parcs, sur les plages, sous les abribus et aux abords des écoles."]]],
H:[["Dates à connaître",["Clovis (466-511) : unifie les Francs. Jeanne d'Arc : guerre de Cent Ans. Les rois sont couronnés à Reims.","1598 : édit de Nantes (Henri IV). Louis XIV, le Roi-Soleil (1643-1715) : château de Versailles.","14 juillet 1789 : prise de la Bastille. 26 août 1789 : DDHC. 1792 : Ière République. 1793 : Louis XVI guillotiné.","1804 : Napoléon empereur, Code civil. 1815 : Waterloo.","1848 : IIe République, abolition de l'esclavage (Victor Schoelcher).","1870 : IIIe République. 1881-1882 : lois Jules Ferry (école gratuite, laïque, obligatoire). 1901 : associations. 1905 : laïcité.","1914-1918 : Première Guerre mondiale, armistice le 11 novembre 1918.","1939-1945 : Seconde Guerre mondiale. 18 juin 1940 : appel du général de Gaulle. 6 juin 1944 : débarquement en Normandie. 25 août 1944 : libération de Paris. 8 mai 1945 : capitulation de l'Allemagne.","1944 : droit de vote des femmes. 1945 : Sécurité sociale, ONU.","1958 : Ve République. 1974 : majorité à 18 ans. 1975 : loi Veil. 1981 : abolition de la peine de mort (Badinter, sous Mitterrand). 2013 : mariage pour tous."]],
["Présidents de la Ve République",["Charles de Gaulle (1959), Georges Pompidou (1969), Valéry Giscard d'Estaing (1974), François Mitterrand (1981), Jacques Chirac (1995), Nicolas Sarkozy (2007), François Hollande (2012), Emmanuel Macron (2017)."]],
["Géographie",["68,6 millions d'habitants en 2025.","Mers : Manche (entre la France et l'Angleterre), mer du Nord, océan Atlantique, mer Méditerranée.","Montagnes : Alpes (Italie), mont Blanc 4 810 m ; Pyrénées (Espagne) ; Massif central, Jura, Vosges.","Fleuves : Loire (le plus long), Seine (Paris), Garonne (Toulouse, Bordeaux), Rhône (Lyon), Rhin (frontière avec l'Allemagne).","Chefs-lieux : Lyon (Auvergne-Rhône-Alpes), Rennes (Bretagne), Marseille (Provence-Alpes-Côte d'Azur), Toulouse (Occitanie), Bordeaux (Nouvelle-Aquitaine).","Grands ports : Le Havre, Marseille-Fos, Dunkerque, Nantes-Saint-Nazaire.","Guyane : frontière avec le Brésil, fusée Ariane à Kourou. La Réunion et Mayotte : océan Indien.","La France est membre permanent du Conseil de sécurité de l'ONU."]],
["Culture et patrimoine",["Louvre : la Joconde. Musée d'Orsay : impressionnistes. Tour Eiffel : Exposition universelle de 1889. Mont-Saint-Michel : Normandie. Lascaux : peintures préhistoriques.","Écrivains : Molière (théâtre, XVIIe), Victor Hugo (Les Misérables, Notre-Dame de Paris), Baudelaire (Les Fleurs du mal), George Sand, Simone de Beauvoir, Albert Camus, Marguerite Yourcenar (première femme à l'Académie française).","Peintres : Delacroix (La Liberté guidant le peuple), Monet (Les Nymphéas), Renoir, Cézanne. Sculpteur : Rodin (Le Penseur). Compositeur : Debussy.","Marie Curie : physicienne, deux prix Nobel. Simone Veil : loi de 1975 sur l'avortement. Jean Moulin : Résistance.","Montesquieu : philosophe des Lumières, dénonce l'esclavage. Nantes : principal port de la traite négrière.","Fêtes : 1er mai (fête du Travail), 8 mai, 14 juillet, 11 novembre. Journées du patrimoine en septembre. Fête de la Musique le 21 juin.","Gastronomie : pot-au-feu, blanquette de veau, bœuf bourguignon, vins et fromages."]]],
V:[["Vie quotidienne",["Locataire : peut peindre les murs ; autres travaux avec l'accord du propriétaire. Il paie le loyer et les charges.","Urgences : 15 SAMU, 17 police, 18 pompiers, 112 urgence européenne, 115 hébergement d'urgence, 119 enfance maltraitée, 3919 violences conjugales.","Santé : inscription à l'Assurance maladie obligatoire. Carte Vitale. Remboursements par la CPAM. Tiers payant. Mutuelle pour le reste. Secret médical.","Place handicapé : réservée aux titulaires de la carte mobilité inclusion.","Déchets : tri, déchèterie pour les appareils électroménagers. Dépôts sauvages interdits."]],
["Travailler",["Durée légale : 35 heures par semaine. SMIC : salaire horaire minimum.","Règles : Code du travail, conventions collectives, règlement intérieur.","Contrat de travail obligatoire (CDD, CDI, intérim). Le travail non déclaré est illégal.","Litiges employeur-salarié : conseil de prud'hommes. Tout travailleur peut se syndiquer.","Recherche d'emploi : s'inscrire à France Travail.","Création d'entreprise : libre, sans condition de nationalité."]],
["Famille et école",["Seul le mariage civil à la mairie est reconnu. Possible à 18 ans. Polygamie interdite. Mariage pour tous depuis 2013.","Divorce : devant un juge ou par consentement mutuel devant un notaire. L'autorité parentale reste aux deux parents.","Naissance : déclaration à la mairie dans les 5 jours.","Congé paternité : 28 jours. Congé parental d'éducation : père ou mère. Pas de licenciement pour grossesse.","Autorité parentale : droits et devoirs dans l'intérêt de l'enfant, sans violence. Châtiments corporels interdits.","Instruction obligatoire de 3 à 16 ans. Inscription à la mairie. Maternelle, élémentaire (6-11 ans), collège (4 ans), lycée (3 ans).","Absences acceptées : santé ou raisons familiales. Les parents peuvent être élus représentants de parents d'élèves."]]]
};

<script>
const KEY="examen-civique-nat-v1",EXAM=new Date(2026,11,19);
const ALL=[];

let S={stats:{},exams:[]};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.stats)S={stats:r.stats,exams:r.exams||[]};}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const mastered=id=>!!S.stats[id]&&S.stats[id].last===1;
const missed=id=>!!S.stats[id]&&S.stats[id].last===0;
const rank=x=>missed(x.id)?0:S.stats[x.id]?2:1;
function record(id,ok){const s=S.stats[id]||(S.stats[id]={c:0,w:0,last:0});if(ok)s.c++;else s.w++;s.last=ok?1:0;save();}
const $=s=>document.querySelector(s);
function el(tag,props,...kids){const n=document.createElement(tag);for(const k in props||{}){const v=props[k];if(v==null||v===false)continue;if(k==="class")n.className=v;else if(k.slice(0,2)==="on")n.addEventListener(k.slice(2),v);else n.setAttribute(k,v===true?"":v);}for(const c of kids.flat(3)){if(c==null||c===false||c==="")continue;n.append(c.nodeType?c:String(c));}return n;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const bar=p=>el("div",{class:"bar"},el("i",{style:"width:"+Math.round(p)+"%"}));
const keyOf=e=>"1234abcd".indexOf(e.key.toLowerCase());
let timer=null,examOn=false,keyFn=null;
document.addEventListener("keydown",e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(keyFn)keyFn(e);});

function go(v,arg){

  examOn=false;if(timer){clearInterval(timer);timer=null;}keyFn=null;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  const app=$("#app");app.innerHTML="";VIEWS[v](app,arg);window.scrollTo(0,0);
}

function home(app){
  const today=new Date();today.setHours(0,0,0,0);
  const days=Math.round((EXAM-today)/864e5),tot=ALL.length;
  const m=ALL.filter(x=>mastered(x.id)).length,ms=ALL.filter(x=>missed(x.id)).length,left=tot-m;
  const perDay=days>2?Math.ceil(left/(days-2)):left;
  const plan=left===0?"You have answered every question correctly at least once. Keep doing mock exams.":days>2?"Plan: about "+perDay+" questions a day covers the whole bank and leaves the last two days for mock exams.":"Final stretch: review your mistakes and do a mock exam.";
  app.append(
    el("section",{class:"hero"},
      el("div",{class:"count"},el("b",null,days>0?days:days===0?"0":"–"),el("span",null,days>1?"days to go":days===1?"day to go":days===0?"exam day":"date passed")),
      el("div",null,el("h1",null,"Your exam: "+EXAM.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})),
        el("p",null,"40 multiple-choice questions in French · 45 minutes · 32 correct answers to pass (80 %)"),
        el("p",{class:"mute small"},plan))),
    el("div",{class:"card"},
      el("div",{class:"stats"},
        el("div",null,el("b",null,m+" / "+tot),el("span",null,"questions answered correctly")),
        el("div",null,el("b",null,ms),el("span",null,"to review (last answer wrong)")),
        el("div",null,el("b",null,tot-Object.keys(S.stats).length),el("span",null,"not seen yet")),
        el("div",null,el("b",null,S.exams.length?Math.max(...S.exams.map(e=>e.s))+" / 40":"–"),el("span",null,"best mock exam"))),
      el("div",{style:"margin-top:14px"},bar(m/tot*100))),
    el("div",{class:"row"},
      el("button",{class:"btn",onclick:()=>go("practice",{t:"ALL",mode:"smart",n:15})},"Quick session · 15 questions"),
      el("button",{class:"btn ghost",disabled:!ms,onclick:()=>go("practice",{t:"ALL",mode:"missed",n:0})},"Review my mistakes ("+ms+")"),
      el("button",{class:"btn ghost",onclick:()=>go("exam")},"Mock exam")),
    el("h3",null,"The five themes"),
    el("div",{class:"grid"},Object.keys(T).map(t=>{
      const qs=ALL.filter(x=>x.t===t),ok=qs.filter(x=>mastered(x.id)).length,w=MIX[t];
      return el("div",{class:"card"},el("b",null,T[t]),
        el("span",{class:"mute small"},(w[0]+w[1])+" of the 40 exam questions"+(w[1]?" · "+w[1]+" are situations":"")),
        bar(ok/qs.length*100),
        el("div",{class:"row spread",style:"margin:0"},el("span",{class:"small mute"},ok+" / "+qs.length),el("button",{class:"btn sm",onclick:()=>go("practice",{t,mode:"smart",n:15})},"Practise")));
    })));
  if(S.exams.length)app.append(el("h3",null,"Mock exam history"),el("div",{class:"card"},el("table",null,S.exams.slice(-6).reverse().map(e=>el("tr",null,el("td",null,new Date(e.d).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})),el("td",null,el("b",{class:e.s>=32?"pass":"fail"},e.s+" / 40")))))));
  app.append(el("div",{class:"card small mute"},
    el("p",null,el("b",null,"About the content. "),"The knowledge questions are the official published list for the naturalisation exam. The official list gives only the questions, so the answer choices and explanations here were written for practice, based on the Livret du citoyen (May 2026 edition); the wording of the choices in the real exam will differ. The 12 « mises en situation » of the real exam are not published; the ones here are practice scenarios in the same spirit."),
    el("p",null,"Your progress is saved in this browser only."),
    el("button",{class:"btn ghost sm",onclick:()=>{if(confirm("Erase all saved progress?")){S={stats:{},exams:[]};save();go("home");}}},"Reset progress")));
}

function qCard(x,done){
  const opts=shuffle(x.o),fb=el("div",{class:"fb",hidden:true});let answered=false;
  const btns=opts.map((o,k)=>el("button",{class:"opt",onclick:()=>pick(k)},el("span",{class:"k"},"ABCD"[k]),el("span",null,o)));
  function pick(k){
    if(answered)return;answered=true;const ok=opts[k]===x.a;
    btns.forEach((b,j)=>{b.disabled=true;if(opts[j]===x.a)b.classList.add("ok");else if(j===k)b.classList.add("bad");});
    fb.hidden=false;fb.className="fb "+(ok?"good":"wrong");
    fb.append(el("b",null,ok?"Correct. ":"Not this one. "),ok?"":"Bonne réponse : "+x.a+". ",x.e);
    done(ok);
  }
  keyFn=e=>{const k=keyOf(e);if(k>=0)pick(k%4);};
  return el("div",{class:"card"},el("div",{class:"tag"},T[x.t]+(x.sit?" · mise en situation":"")),el("h2",null,x.q),el("div",{class:"opts"},btns),fb);
}

function practice(app,arg){
  const cfg=Object.assign({t:"ALL",mode:"smart",n:15},arg||{});
  const sel=(key,opts)=>{const s=el("select",{onchange:e=>{cfg[key]=e.target.value;}});opts.forEach(([v,l])=>{const o=el("option",{value:v},l);if(String(v)===String(cfg[key]))o.selected=true;s.append(o);});return s;};
  const stage=el("div");
  app.append(el("h1",null,"Practice"),el("p",{class:"mute"},"You see the correct answer and an explanation after each question. Keyboard: 1–4 or A–D to answer, Enter for the next question."),
    el("div",{class:"card controls"},
      el("label",null,"Theme",sel("t",[["ALL","All themes"]].concat(Object.keys(T).map(t=>[t,T[t]])))),
      el("label",null,"Questions",sel("mode",[["smart","Mistakes first, then new ones"],["new","Only questions not seen yet"],["missed","Only my mistakes"],["sit","Only mises en situation"],["all","Everything, random order"]])),
      el("label",null,"Length",sel("n",[[10,"10"],[15,"15"],[30,"30"],[0,"All"]])),
      el("button",{class:"btn",onclick:run},"Start")),stage);
  function run(){
    let pool=ALL.filter(x=>cfg.t==="ALL"||x.t===cfg.t);
    if(cfg.mode==="missed")pool=pool.filter(x=>missed(x.id));
    if(cfg.mode==="new")pool=pool.filter(x=>!S.stats[x.id]);
    if(cfg.mode==="sit")pool=pool.filter(x=>x.sit);
    pool=shuffle(pool);
    if(cfg.mode==="smart")pool.sort((a,b)=>rank(a)-rank(b));
    const n=+cfg.n,list=n?pool.slice(0,n):pool;let i=0,good=0;const wrong=[];
    if(!list.length){stage.innerHTML="";keyFn=null;stage.append(el("div",{class:"card"},"No questions match these settings. Try another theme or mode."));return;}
    (function show(){
      stage.innerHTML="";
      if(i>=list.length){
        keyFn=null;
        stage.append(el("div",{class:"card"},el("div",{class:"big "+(good/list.length>=.8?"pass":"fail")},good+" / "+list.length),
          el("p",{class:"mute"},good/list.length>=.8?"At or above the 80 % pass mark.":"The pass mark in the exam is 80 %."),
          wrong.length?el("div",null,el("h3",null,"To review"),wrong.map(x=>el("details",null,el("summary",null,x.q),el("div",{class:"ans"},el("b",null,x.a),x.e?" — "+x.e:"")))):null,
          el("div",{class:"row",style:"margin-top:16px"},el("button",{class:"btn",onclick:run},"Another session"),el("button",{class:"btn ghost",onclick:()=>go("home")},"Dashboard"))));
        return;
      }
      const x=list[i],next=el("button",{class:"btn",hidden:true,onclick:()=>{i++;show();}},i+1<list.length?"Next question →":"See my score");
      stage.append(el("div",{class:"prog"},el("span",null,"Question "+(i+1)+" / "+list.length),bar(i/list.length*100),el("span",null,good+" correct")),
        qCard(x,ok=>{record(x.id,ok);if(ok)good++;else wrong.push(x);next.hidden=false;next.focus();}),next);
    })();
  }
  if(arg)run();
}

function exam(app){
  app.append(el("h1",null,"Mock exam"),el("div",{class:"card"},
    el("p",null,"Same format as the real exam: 40 questions, 45 minutes, no feedback until the end, 32 correct answers to pass."),
    el("table",null,el("tr",null,el("th",null,"Theme"),el("th",null,"Questions")),Object.keys(T).map(t=>el("tr",null,el("td",null,T[t]+(MIX[t][1]?" (including "+MIX[t][1]+" mises en situation)":"")),el("td",null,MIX[t][0]+MIX[t][1])))),
    el("p",{class:"mute small",style:"margin-top:12px"},"Keyboard: 1–4 or A–D to choose, ← → to move between questions. You can change an answer at any time before finishing."),
    el("button",{class:"btn",onclick:()=>runExam(app)},"Start the 45-minute exam")));
}
function runExam(app){
  app.innerHTML="";let list=[];
  for(const t in MIX){const[k,s]=MIX[t];list=list.concat(shuffle(ALL.filter(x=>x.t===t&&!x.sit)).slice(0,k),shuffle(ALL.filter(x=>x.t===t&&x.sit)).slice(0,s));}
  const qs=shuffle(list).map(x=>({x,o:shuffle(x.o),p:-1}));let i=0;const end=Date.now()+45*6e4;examOn=true;
  const clock=el("b",{class:"clock"}),stage=el("div"),pal=el("div",{class:"pal"});
  const ask=()=>{const n=qs.filter(z=>z.p<0).length;if(confirm(n?"Finish now? "+n+" unanswered question(s) will count as wrong.":"Finish the exam and see your score?"))finish();};
  app.append(el("div",{class:"examtop"},el("b",null,"Mock exam"),clock,el("button",{class:"btn ghost sm",onclick:ask},"Finish")),stage,pal);
  function tick(){const r=Math.max(0,end-Date.now());clock.textContent=Math.floor(r/6e4)+":"+String(Math.floor(r%6e4/1e3)).padStart(2,"0");clock.classList.toggle("low",r<3e5);if(r<=0)finish();}
  function draw(){
    const q=qs[i];stage.innerHTML="";pal.innerHTML="";
    stage.append(el("div",{class:"card"},el("div",{class:"tag"},"Question "+(i+1)+" / "+qs.length+" · "+T[q.x.t]),el("h2",null,q.x.q),
      el("div",{class:"opts"},q.o.map((o,k)=>el("button",{class:"opt"+(q.p===k?" sel":""),onclick:()=>{q.p=k;draw();}},el("span",{class:"k"},"ABCD"[k]),el("span",null,o))))),
      el("div",{class:"row spread"},el("button",{class:"btn ghost",disabled:i===0,onclick:()=>{i--;draw();}},"← Previous"),
        i<qs.length-1?el("button",{class:"btn",onclick:()=>{i++;draw();}},"Next →"):el("button",{class:"btn",onclick:ask},"Finish exam")));
    qs.forEach((z,j)=>pal.append(el("button",{class:"dot"+(z.p>=0?" done":"")+(j===i?" cur":""),"aria-label":"Question "+(j+1),onclick:()=>{i=j;draw();}},j+1)));
    keyFn=e=>{const k=keyOf(e);if(k>=0){q.p=k%4;draw();}else if(e.key==="ArrowRight"&&i<qs.length-1){i++;draw();}else if(e.key==="ArrowLeft"&&i>0){i--;draw();}};
  }
  function finish(){
    if(!examOn)return;examOn=false;clearInterval(timer);timer=null;keyFn=null;
    let score=0,sit=0;const per={};
    qs.forEach(z=>{z.ok=z.p>=0&&z.o[z.p]===z.x.a;if(z.ok){score++;if(z.x.sit)sit++;}record(z.x.id,z.ok);const p=per[z.x.t]||(per[z.x.t]=[0,0]);p[1]++;if(z.ok)p[0]++;});
    S.exams.push({d:Date.now(),s:score});save();
    const bad=qs.filter(z=>!z.ok);app.innerHTML="";
    app.append(el("h1",null,"Result"),el("div",{class:"card"},el("div",{class:"big "+(score>=32?"pass":"fail")},score+" / 40"),
      el("p",null,score>=32?"Passed. The pass mark is 32.":"Not yet: the pass mark is 32. You need "+(32-score)+" more correct answer"+(32-score>1?"s":"")+"."),

function list(app){

  const sel=el("select",{onchange:e=>{t=e.target.value;draw();}},el("option",{value:"ALL"},"All themes"),Object.keys(T).map(k=>el("option",{value:k},T[k])));
